<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>目录 - 悦读小将</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'KaiTi', 'STKaiti', '楷体', cursive, serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
            overflow: hidden;
        }
        .navbar {
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
            color: #e8e0c8;
            padding: 10px 20px;
            height: 52px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #8B7355;
        }
        .navbar h1 {
            font-size: 18px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            text-align: center;
            margin: 0;
            padding: 0 10px;
        }
        .navbar .back-btn {
            background: none;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            line-height: 1;
        }
        .navbar .back-btn img {
            width: 24px;
            height: 24px;
        }
        .book-stats-bar {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            z-index: 99;
            background: #f8f8f5;
            color: #666;
            font-size: 14px;
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .catalog-container {
            margin-top: 52px;
            padding: 15px;
            overflow-y: auto;
            height: calc(100vh - 52px);
        }
        .catalog-container.with-stats {
            margin-top: 88px;
            height: calc(100vh - 88px);
        }
        .book-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }
        .book-title {
            font-size: 22px;
            font-weight: 600;
            color: #2d5016;
            margin-bottom: 8px;
        }
        .book-meta {
            font-size: 14px;
            color: #666;
        }
        .chapter {
            margin-bottom: 15px;
        }
        .chapter-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 15px;
            background: #f8f8f5;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #2d5016;
        }
        .section {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px 10px 36px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.15s;
            font-size: 15px;
        }
        .section:hover {
            background: #f0f0e8;
        }
        .section .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .section .status.read { background: #4CAF50; }
        .section .status.reading { background: #FF9800; }
        .section .status.unread { background: #ddd; }
        .section .title {
            flex: 1;
            color: #333;
        }
        .section .sec-bookmark {
            font-size: 14px;
            flex-shrink: 0;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="display:flex;align-items:center;">
            <img src="favicon.png" style="width:28px;height:28px;border-radius:4px;margin-left:10px;">
        </div>
        <h1 id="bookTitle">加载中...</h1>
        <button class="back-btn" onclick="goBack()"><img src="back.png" alt="返回"></button>
    </div>

    <div class="book-stats-bar" id="bookStatsBar" style="display:none;">
        <span id="bookStatsText"></span>
    </div>

    <div class="catalog-container" id="catalogContent">
        <div class="loading">加载中...</div>
    </div>

    <div id="rankUpModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:2000;justify-content:center;align-items:center;" onclick="closeRankUpModal()">
        <div style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);border-radius:16px;padding:32px 24px;width:85%;max-width:360px;text-align:center;color:white;position:relative;animation:celebrationBounce 0.6s cubic-bezier(0.34,1.56,0.64,1);" onclick="event.stopPropagation()">
            <div style="position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:48px;animation:celebrationFloat 2s ease-in-out infinite;">🎉</div>
            <div style="font-size:16px;color:rgba(255,255,255,0.7);margin-bottom:4px;margin-top:10px;">恭喜军衔晋升！</div>
            <div id="rankUpEpaulette" style="margin:12px auto;"></div>
            <div style="font-size:30px;font-weight:bold;color:#FFD700;margin-bottom:4px;text-shadow:0 0 20px rgba(255,215,0,0.5);" id="rankUpName">上等兵</div>
            <div style="font-size:15px;color:rgba(255,255,255,0.6);margin-bottom:16px;" id="rankUpTitle">阅读学徒</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:20px;">累计阅读 <span id="rankUpWords" style="color:#FFD700;font-weight:bold;">0</span> 字</div>
            <button onclick="closeRankUpModal()" style="padding:12px 48px;background:linear-gradient(90deg,#FFD700,#FFA500);color:#1a1a2e;border:none;border-radius:24px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(255,215,0,0.4);">太棒了！</button>
        </div>
    </div>

    <div id="awardModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:2000;justify-content:center;align-items:center;" onclick="closeAwardModal()">
        <div style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);border-radius:16px;padding:32px 24px;width:85%;max-width:360px;text-align:center;color:white;position:relative;animation:celebrationBounce 0.6s cubic-bezier(0.34,1.56,0.64,1);" onclick="event.stopPropagation()">
            <div style="position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:48px;animation:celebrationFloat 2s ease-in-out infinite;">🏆</div>
            <div style="font-size:16px;color:rgba(255,255,255,0.7);margin-bottom:8px;margin-top:10px;">恭喜获得新荣誉！</div>
            <div id="awardContent" style="margin:16px 0;"></div>
            <button onclick="closeAwardModal()" style="padding:12px 48px;background:linear-gradient(90deg,#FFD700,#FFA500);color:#1a1a2e;border:none;border-radius:24px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(255,215,0,0.4);">太棒了！</button>
        </div>
    </div>

    <style>
        @keyframes celebrationBounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.08); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes celebrationFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }
    </style>

    <script>
        const API_BASE = '/api';
        var state = {
            currentUser: null,
            currentBook: null,
            sections: [],
            catalogStatusMap: {},
            progress: null,
            freeSections: 3,
            unlockPoints: 0,
            isUnlocked: false
        };
        var isRegisteredUser = false;

        function encodeParams(obj) {
            return 'p=' + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
        }

        function decodeParams() {
            var m = window.location.search.match(/[?&]p=([^&]+)/);
            if (!m) return {};
            try { return JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch(e) { return {}; }
        }

        function getDeviceInfo() {
            var ua = navigator.userAgent;
            var deviceModel = '';
            var buildMatch = ua.match(/;\s*([^;]+)\s+Build\//);
            if (buildMatch) { deviceModel = buildMatch[1].trim(); }
            else if (/iPhone|iPad|iPod/.test(ua)) { deviceModel = /iPad/.test(ua) ? 'iPad' : 'iPhone'; }
            var hardwareFingerprint = deviceModel + '|' + window.screen.width + 'x' + window.screen.height;
            var hash = 0;
            for (var i = 0; i < hardwareFingerprint.length; i++) {
                var char = hardwareFingerprint.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return { deviceId: 'D' + Math.abs(hash).toString(16).toUpperCase() };
        }

        function getDeviceDisplayName() {
            var ua = navigator.userAgent;
            if (/iPhone/.test(ua)) return 'iPhone';
            if (/iPad/.test(ua)) return 'iPad';
            if (/Android/.test(ua)) return 'Android设备';
            if (/Windows/.test(ua)) return 'Windows电脑';
            if (/Mac/.test(ua)) return 'Mac电脑';
            return '未知设备';
        }

        // 返回书架
        function goBack() {
            location.href = '/';
        }

        // 加载目录
        async function loadCatalog() {
            var params = decodeParams();
            var bookId = params.book_id;
            if (!bookId) {
                alert('缺少书籍ID');
                goBack();
                return;
            }

            var userId = localStorage.getItem('userId') || '';

            if (!userId) {
                try {
                    var deviceInfo = getDeviceInfo();
                    var anonResp = await fetch(API_BASE + '/auth/anonymous', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ device_id: deviceInfo.deviceId, device_info: getDeviceDisplayName() })
                    });
                    var anonData = await anonResp.json();
                    if (anonData.user) {
                        userId = String(anonData.user.id);
                        localStorage.setItem('userId', userId);
                    }
                } catch(e) {}
            }

            isRegisteredUser = localStorage.getItem('isRegistered') === '1';
            console.log('[初始] localStorage.isRegistered:', localStorage.getItem('isRegistered'), '=> isRegisteredUser:', isRegisteredUser);
            if (!isRegisteredUser && userId) {
                try {
                    var checkResp = await fetch(API_BASE + '/auth/check?user_id=' + userId);
                    var checkData = await checkResp.json();
                    console.log('[auth/check] 响应:', checkData);
                    if (checkData.user && checkData.user.phone) {
                        isRegisteredUser = true;
                        localStorage.setItem('isRegistered', '1');
                        console.log('[auth/check] 检测到注册用户，已更新 isRegistered=1');
                    }
                } catch(e) { console.error('[注册检查] 失败:', e); }
            }
            console.log('[目录页] isRegisteredUser:', isRegisteredUser, 'userId:', userId);

            try {
                var response = await fetch(API_BASE + '/books/' + bookId + '?user_id=' + userId);
                var data = await response.json();

                if (!response.ok) {
                    alert('加载失败: ' + data.error);
                    goBack();
                    return;
                }

                state.currentBook = data.book;
                state.sections = data.sections || [];
                state.currentUser = { id: userId };
                state.progress = data.progress || null;
                state.currentProgressV2 = data.progress_v2 || null;
                state.freeSections = data.book.free_sections || 3;
                state.unlockPoints = data.book.unlock_points || 0;
                state.isUnlocked = data.book.is_unlocked || false;
                console.log('[书籍数据] freeSections:', state.freeSections, 'unlockPoints:', state.unlockPoints, 'isUnlocked:', state.isUnlocked);

                try {
                    var statusResponse = await fetch(API_BASE + '/books/' + bookId + '/reading-status?user_id=' + userId);
                    var statusData = await statusResponse.json();
                    if (statusData.statuses) {
                        var statusMap = {};
                        statusData.statuses.forEach(function(s) { statusMap[s.section_id] = s.status; });
                        state.catalogStatusMap = statusMap;
                    }
                } catch(e) {}

                var titleHtml = '<span style="font-size:16px;">' + data.book.title + '</span>';
                if (data.book.author) {
                    var authorInfo = data.book.author + (data.book.author_nationality ? ' [' + data.book.author_nationality + ']' : '');
                    titleHtml += ' <span style="font-size:12px;">' + authorInfo + '</span>';
                }
                document.getElementById('bookTitle').innerHTML = titleHtml;

                var totalSec = state.sections.length;
                var readSec = 0;
                var totalWords = 0;
                var totalAnno = 0;
                state.sections.forEach(function(sec) {
                    var st = state.catalogStatusMap[sec.id] || 'unread';
                    if (st === 'read') readSec++;
                    totalWords += sec.word_count || 0;
                    totalAnno += (sec.annotations || []).length;
                });
                var wordsStr = totalWords >= 10000 ? (totalWords / 10000).toFixed(1) + '万' : totalWords;
                document.getElementById('bookStatsText').textContent = '本书共：' + totalSec + '节 | ' + wordsStr + '字 | ' + totalAnno + '点评 | 已读' + readSec + '节';
                document.getElementById('bookStatsBar').style.display = '';
                document.getElementById('catalogContent').classList.add('with-stats');

                renderCatalog();
            } catch (e) {
                alert('网络错误: ' + e.message);
                goBack();
            }
        }

        // 渲染目录
        function renderCatalog() {
            var container = document.getElementById('catalogContent');

            if (state.sections.length === 0) {
                container.innerHTML = '<div class="loading">暂无章节</div>';
                return;
            }

            var html = '';

            var bookmarkSectionId = null;
            if (state.currentProgressV2 && state.currentProgressV2.current_section_id) {
                bookmarkSectionId = parseInt(state.currentProgressV2.current_section_id);
            }

            var currentChapter = null;
            var lockCount = 0;
            state.sections.forEach(function(section, index) {
                if (section.chapter_number && section.chapter_number !== currentChapter) {
                    currentChapter = section.chapter_number;
                    html += '<div class="chapter">' +
                        '<div class="chapter-header">第' + currentChapter + '章</div>';
                }

                var status = state.catalogStatusMap[section.id] || 'unread';
                var statusClass = status === 'read' ? 'read' : (status === 'reading' ? 'reading' : 'unread');
                var isBookmark = (parseInt(section.id) === bookmarkSectionId);
                var isLocked = false;
                var lockType = '';
                if (!isRegisteredUser) {
                    isLocked = index >= 3;
                    lockType = 'anonymous';
                } else if (!state.isUnlocked) {
                    isLocked = index >= state.freeSections;
                    lockType = 'unlock';
                }
                if (isLocked) lockCount++;

                if (isLocked) {
                    var clickHandler = lockType === 'anonymous' ? 'showLoginTip()' : 'showUnlockTip()';
                    html += '<div class="section" style="opacity:0.5;" onclick="' + clickHandler + '">' +
                        '<div class="status unread"></div>' +
                        '<div class="title">' + (section.title || '第' + section.section_number + '节') + ' 🔒</div>' +
                        '</div>';
                } else {
                    html += '<div class="section" onclick="openSection(' + section.id + ')">' +
                        '<div class="status ' + statusClass + '"></div>' +
                        '<div class="title">' + (section.title || '第' + section.section_number + '节') + '</div>' +
                        (isBookmark ? '<span class="sec-bookmark">🔖</span>' : '') +
                        '</div>';
                }
            });

            container.innerHTML = html;
            console.log('[目录渲染] isRegisteredUser:', isRegisteredUser, '锁定节数:', lockCount, '总节数:', state.sections.length);
        }

        // 打开章节
        function openSection(sectionId) {
            var sectionIndex = state.sections.findIndex(function(s) { return s.id === sectionId; });
            if (sectionIndex < 0) return;

            if (!isRegisteredUser && sectionIndex >= 3) {
                console.log('[锁检查] 匿名用户锁: isRegisteredUser=', isRegisteredUser, 'sectionIndex=', sectionIndex);
                showLoginTip();
                return;
            }

            if (isRegisteredUser && !state.isUnlocked && sectionIndex >= state.freeSections) {
                console.log('[锁检查] 注册用户锁: isUnlocked=', state.isUnlocked, 'freeSections=', state.freeSections, 'sectionIndex=', sectionIndex);
                showUnlockTip();
                return;
            }

            var sectionStatus = state.catalogStatusMap[sectionId] || 'unread';
            if (sectionStatus === 'unread') {
                if (sectionIndex > 0) {
                    var prevSection = state.sections[sectionIndex - 1];
                    var prevStatus = state.catalogStatusMap[prevSection.id] || 'unread';
                    if (prevStatus !== 'read') {
                        alert('请先完成上一节的阅读');
                        return;
                    }
                }
            }

            location.href = 'reader.html?' + encodeParams({book_id: state.currentBook.id, section_id: sectionId});
        }

        function showUnlockTip() {
            if (state.unlockPoints === 0) {
                alert('该书籍暂未开放解锁，请联系管理员');
                return;
            }
            if (confirm('解锁《' + state.currentBook.title + '》将消耗 ' + state.unlockPoints + ' 积分\n\n确定解锁吗？')) {
                unlockBook();
            }
        }

        async function unlockBook() {
            var userId = localStorage.getItem('userId');
            if (!userId) { alert('请先登录'); return; }
            try {
                var response = await fetch(API_BASE + '/books/' + state.currentBook.id + '/unlock', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId})
                });
                var data = await response.json();
                if (data.message) {
                    alert('解锁成功！');
                    state.isUnlocked = true;
                    renderCatalog();
                } else {
                    alert(data.error || '解锁失败');
                }
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
        }

        function showLoginTip() {
            alert('注册登录后可阅读全书，匿名用户仅可阅读前3节');
        }

        var iconToLevel = {
            'private': 1, 'private_first': 2,
            'sergeant_1': 3, 'sergeant_2': 4, 'sergeant_3': 5,
            'sergeant_4': 6, 'sergeant_5': 7, 'sergeant_6': 8, 'sergeant_7': 9,
            '2lt': 10, '1lt': 11, 'cpt': 12,
            'maj': 13, 'ltc': 14, 'col': 15, 'sen_col': 16,
            'bg': 17, 'mg': 18, 'lg': 19, 'marshal': 20
        };

        function renderEpaulette(icon) {
            var level = iconToLevel[icon] || 1;
            return '<img src="ranks/rank_' + level + '.png" style="width:80px;display:block;margin:0 auto;" alt="肩章">';
        }

        function showRankUpCelebration(rank, totalWords) {
            document.getElementById('rankUpEpaulette').innerHTML = renderEpaulette(rank.icon || 'private');
            document.getElementById('rankUpName').textContent = rank.rank_name;
            document.getElementById('rankUpTitle').textContent = rank.title || '';
            document.getElementById('rankUpWords').textContent = (totalWords || 0).toLocaleString();
            document.getElementById('rankUpModal').style.display = 'flex';
        }

        function closeRankUpModal() {
            document.getElementById('rankUpModal').style.display = 'none';
            checkPendingAwards();
        }

        function showAwardCelebration(newMerits, newMedals) {
            var meritIcons = {'一等功': 'medals/merit_1.png', '二等功': 'medals/merit_2.png', '三等功': 'medals/merit_3.png', '嘉奖': 'medals/merit_4.png'};
            var meritColors = {'一等功': '#FFD700', '二等功': '#C0C0C0', '三等功': '#CD7F32', '嘉奖': '#8B4513'};
            var medalIcons = {'红星勋章': 'medals/medal_red_star.png', '红旗勋章': 'medals/medal_red_flag.png', '八一勋章': 'medals/medal_bayi.png'};
            var html = '';
            if (newMerits && newMerits.length > 0) {
                html += '<div style="margin-bottom:12px;">';
                newMerits.forEach(function(m) {
                    var type = m.merit_type || m;
                    html += '<div style="display:inline-block;background:rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;margin:4px;text-align:center;">'
                        + '<img src="' + (meritIcons[type] || 'medals/merit_4.png') + '" style="height:44px;display:block;margin:0 auto;" alt="' + type + '">'
                        + '<div style="font-size:14px;color:' + (meritColors[type] || '#FFD700') + ';font-weight:bold;margin-top:6px;">' + type + '</div>'
                        + '</div>';
                });
                html += '</div>';
            }
            if (newMedals && newMedals.length > 0) {
                html += '<div style="margin-bottom:8px;">';
                newMedals.forEach(function(m) {
                    var type = m.medal_type || m;
                    html += '<div style="display:inline-block;background:rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;margin:4px;text-align:center;">'
                        + '<img src="' + (medalIcons[type] || 'medals/medal_red_star.png') + '" style="height:44px;display:block;margin:0 auto;" alt="' + type + '">'
                        + '<div style="font-size:14px;color:#FFD700;font-weight:bold;margin-top:6px;">' + type + '</div>'
                        + '</div>';
                });
                html += '</div>';
            }
            if (!html) return;
            document.getElementById('awardContent').innerHTML = html;
            document.getElementById('awardModal').style.display = 'flex';
        }

        function closeAwardModal() {
            document.getElementById('awardModal').style.display = 'none';
        }

        function checkPendingCelebrations() {
            var rankUpData = localStorage.getItem('pendingRankUp');
            if (rankUpData) {
                localStorage.removeItem('pendingRankUp');
                try {
                    var parsed = JSON.parse(rankUpData);
                    showRankUpCelebration(parsed.rank, parsed.total_words);
                } catch(e) {}
                return;
            }
            checkPendingAwards();
        }

        function checkPendingAwards() {
            var awardData = localStorage.getItem('pendingAwards');
            if (awardData) {
                localStorage.removeItem('pendingAwards');
                try {
                    var parsed = JSON.parse(awardData);
                    var merits = parsed.merits || [];
                    var medals = parsed.medals || [];
                    if (merits.length > 0 || medals.length > 0) {
                        showAwardCelebration(merits, medals);
                    }
                } catch(e) {}
            }
        }

        // 初始化
        loadCatalog();
        setTimeout(checkPendingCelebrations, 500);
    </script>
</body>
</html>
