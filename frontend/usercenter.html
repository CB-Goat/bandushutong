<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>用户中心 - 悦读小将</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'KaiTi', 'STKaiti', '楷体', cursive, serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        .navbar {
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
            color: #e8e0c8;
            padding: 10px 20px;
            height: 52px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #8B7355;
        }
        .navbar h1 {
            font-size: 18px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .navbar .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e8e0c8;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            margin-right: 10px;
        }
        .container {
            margin-top: 52px;
            padding: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h3 {
            margin: 0 0 20px;
            color: #333;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #2d5016;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover {
            background: #3a6b1e;
        }
        .page { display: none; }
        .page.active { display: block; }
        .rank-card {
            background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
            border-radius: 12px;
            padding: 20px;
            color: white;
            margin-bottom: 20px;
        }
        .rank-name {
            font-size: 24px;
            color: #FFD700;
            margin-bottom: 10px;
        }
        .rank-progress {
            font-size: 14px;
            color: #e8e0c8;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1 id="pageTitle">用户中心</h1>
    </div>

    <div class="container">
        <!-- 用户信息页 -->
        <div class="page" id="userInfoPage">
            <div class="card">
                <h3>个人信息</h3>
                <div class="form-group">
                    <label>性别</label>
                    <select id="userGender">
                        <option value="">未设置</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>年龄</label>
                    <input type="number" id="userAge" placeholder="请输入年龄" min="1" max="120">
                </div>
                <div class="form-group">
                    <label>年级</label>
                    <select id="userGrade">
                        <option value="">未设置</option>
                        <option value="小学一年级">小学一年级</option>
                        <option value="小学二年级">小学二年级</option>
                        <option value="小学三年级">小学三年级</option>
                        <option value="小学四年级">小学四年级</option>
                        <option value="小学五年级">小学五年级</option>
                        <option value="小学六年级">小学六年级</option>
                        <option value="初中一年级">初中一年级</option>
                        <option value="初中二年级">初中二年级</option>
                        <option value="初中三年级">初中三年级</option>
                        <option value="高中一年级">高中一年级</option>
                        <option value="高中二年级">高中二年级</option>
                        <option value="高中三年级">高中三年级</option>
                        <option value="大学生">大学生</option>
                        <option value="成人">成人</option>
                    </select>
                </div>
                <button class="btn" onclick="saveProfile()">保存个人信息</button>
            </div>
        </div>

        <!-- 密码安全页 -->
        <div class="page" id="passwordPage">
            <div class="card">
                <h3>修改密码</h3>
                <div class="form-group">
                    <label>原密码</label>
                    <input type="password" id="oldPassword" placeholder="请输入原密码">
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="newPassword" placeholder="至少6位">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                </div>
                <button class="btn" onclick="changePassword()">修改密码</button>
            </div>
        </div>

        <!-- 留言反馈页 -->
        <div class="page" id="messagePage">
            <div class="card">
                <h3>留言反馈</h3>
                <div class="form-group">
                    <textarea id="messageContent" rows="4" placeholder="请输入您的需求、意见或建议..."></textarea>
                </div>
                <button class="btn" onclick="submitMessage()">提交留言</button>
            </div>
        </div>

        <!-- 军衔军功页 -->
        <div class="page" id="rankMeritsPage">
            <div class="rank-card">
                <div class="rank-name" id="rankName">暂无军衔</div>
                <div class="rank-progress" id="rankProgress">阅读更多书籍获得军衔晋升</div>
            </div>
            <div class="card">
                <h3>我的军功</h3>
                <div id="meritsList" style="color: #999; text-align: center; padding: 20px;">暂无军功</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        var state = {
            currentUser: null
        };

        function getUrlParam(name) {
            var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        function goBack() {
            location.href = 'bookshelf.html';
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            var target = document.getElementById(pageId);
            if (target) target.classList.add('active');

            var titles = {
                'userInfoPage': '用户信息',
                'passwordPage': '密码安全',
                'messagePage': '留言反馈',
                'rankMeritsPage': '军衔军功'
            };
            document.getElementById('pageTitle').textContent = titles[pageId] || '用户中心';
        }

        async function loadUserProfile() {
            var userId = localStorage.getItem('userId');
            if (!userId) {
                alert('请先登录');
                goBack();
                return;
            }

            try {
                var response = await fetch(API_BASE + '/users/' + userId);
                var data = await response.json();
                if (data.user) {
                    state.currentUser = data.user;
                    document.getElementById('userGender').value = data.user.gender || '';
                    document.getElementById('userAge').value = data.user.age || '';
                    document.getElementById('userGrade').value = data.user.grade || '';
                }
            } catch (e) {
                console.error('加载用户信息失败:', e);
            }
        }

        async function saveProfile() {
            var userId = localStorage.getItem('userId');
            var data = {
                user_id: userId,
                gender: document.getElementById('userGender').value,
                age: parseInt(document.getElementById('userAge').value) || null,
                grade: document.getElementById('userGrade').value
            };

            try {
                var response = await fetch(API_BASE + '/users/' + userId + '/profile', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                var result = await response.json();
                if (response.ok) {
                    alert('保存成功');
                } else {
                    alert('保存失败: ' + result.error);
                }
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
        }

        async function changePassword() {
            var userId = localStorage.getItem('userId');
            var oldPwd = document.getElementById('oldPassword').value;
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;

            if (!oldPwd || !newPwd || !confirmPwd) {
                alert('请填写完整');
                return;
            }
            if (newPwd !== confirmPwd) {
                alert('两次密码不一致');
                return;
            }

            try {
                var response = await fetch(API_BASE + '/users/' + userId + '/password', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        old_password: oldPwd,
                        new_password: newPwd
                    })
                });
                var result = await response.json();
                if (response.ok) {
                    alert('修改成功');
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                } else {
                    alert('修改失败: ' + result.error);
                }
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
        }

        async function submitMessage() {
            var userId = localStorage.getItem('userId');
            var content = document.getElementById('messageContent').value.trim();

            if (!content) {
                alert('请输入留言内容');
                return;
            }

            try {
                var response = await fetch(API_BASE + '/messages', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        content: content
                    })
                });
                var result = await response.json();
                if (response.ok) {
                    alert('提交成功');
                    document.getElementById('messageContent').value = '';
                } else {
                    alert('提交失败: ' + result.error);
                }
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
        }

        async function loadMilitaryRank() {
            var userId = localStorage.getItem('userId');
            try {
                var response = await fetch(API_BASE + '/users/' + userId + '/military-rank');
                var data = await response.json();
                if (data.military_rank && data.military_rank.current_rank) {
                    document.getElementById('rankName').textContent = data.military_rank.current_rank.rank_name;
                    document.getElementById('rankProgress').textContent = '累计阅读 ' + (data.military_rank.total_sections_read || 0) + ' 节';
                }
            } catch (e) {
                console.error('加载军衔失败:', e);
            }
        }

        // 初始化
        var page = getUrlParam('page') || 'userInfo';
        var pageMap = {
            'userInfo': 'userInfoPage',
            'password': 'passwordPage',
            'message': 'messagePage',
            'rankMerits': 'rankMeritsPage'
        };
        var targetPage = pageMap[page] || 'userInfoPage';
        showPage(targetPage);

        if (targetPage === 'userInfoPage') {
            loadUserProfile();
        } else if (targetPage === 'rankMeritsPage') {
            loadMilitaryRank();
        }
    </script>
</body>
</html>
