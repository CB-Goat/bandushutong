    <script>
        const API_BASE = '/api';

        // 点评序号映射：1 -> ①, 2 -> ②, ...
        const CIRCLED_NUMBERS = ['\u2460','\u2461','\u2462','\u2463','\u2464','\u2465','\u2466','\u2467','\u2468','\u2469','\u246A','\u246B','\u246C','\u246D','\u246E','\u246F','\u2470','\u2471','\u2472','\u2473'];

        function getCircledNumber(num) {
            if (num >= 1 && num <= 20) return CIRCLED_NUMBERS[num - 1];
            return String(num);
        }

        const state = {
            currentUser: null,  // 当前登录用户
            books: [],
            currentBook: null,
            currentSections: [],
            currentSectionIndex: 0,
            isPlaying: false,
            // 当前节的点评数据
            currentAnnotations: [],
            // 编辑点评模式
            isAnnotationEditMode: false,
            // 点评播放状态
            isPlayingAnnotation: false,
            annotationPlaybackPaused: false,
            // 管理和浏览页面状态
            adminCurrentBookId: null,
            adminCurrentChapterId: null,
            browseCurrentBookId: null,
        };

        document.addEventListener('DOMContentLoaded', function() {
            initDatabase();
            checkLogin();
            setupEventListeners();
            player.init();
        });

        async function initDatabase() {
            try { await fetch(API_BASE + '/init', { method: 'POST' }); } catch(e) {}
        }

        function setupEventListeners() {
            document.getElementById('uploadArea').addEventListener('click', function() {
                document.getElementById('fileInput').click();
            });
            document.getElementById('fileInput').addEventListener('change', handleFileUpload);
            document.getElementById('backBtn').addEventListener('click', function() {
                // 根据当前页面决定返回位置
                var readerPage = document.getElementById('readerPage');
                if (readerPage.classList.contains('active')) {
                    // 阅读页 → 返回目录页
                    reader.saveProgress(reader._currentPosition);
                    showPage('catalogPage');
                    player.stop();
                    annotationEditor.exitEditMode();
                } else {
                    // 目录页 → 返回书架
                    showPage('homePage');
                }
            });
            var audio = document.getElementById('audioPlayer');
            audio.addEventListener('timeupdate', player.onTimeUpdate);
            audio.addEventListener('ended', player.onEnded);
            audio.addEventListener('loadedmetadata', player.onLoadedMetadata);
        }

        async function handleFileUpload(e) {
            var file = e.target.files[0];
            if (!file) return;
            var formData = new FormData();
            formData.append('file', file);
            try {
                showLoading('正在解析书籍...');
                var response = await fetch(API_BASE + '/upload', { method: 'POST', body: formData });
                var data = await response.json();
                if (response.ok) {
                    alert('上传成功！共解析出 ' + data.sections_count + ' 个小节');
                    loadBooks();
                } else {
                    alert('上传失败: ' + data.error);
                }
            } catch (e) {
                alert('上传出错: ' + e.message);
            } finally { hideLoading(); }
        }

        // ===== 目录页 =====
        async function showBookCatalog(bookId) {
            showLoading('加载目录...');
            showPage('catalogPage');
            try {
                // 获取书籍基本信息
                var bookResp = await fetch(API_BASE + '/books/' + bookId);
                var bookData = await bookResp.json();
                var book = bookData.book;
                var sections = bookData.sections || [];

                // 设置导航栏标题
                document.getElementById('navbarTitle').innerHTML = '<span style="font-size:16px;">' + (book.title || '') + '</span>' +
                    (book.author ? ' <small style="font-size:12px;">' + book.author + (book.author_nationality ? ' [' + book.author_nationality + ']' : '') + '</small>' : '');

                // 获取阅读状态和统计
                var stResp = await fetch(API_BASE + '/books/' + bookId + '/reading-status');
                var stData = await stResp.json();
                var statusMap = {};
                (stData.statuses || []).forEach(function(s) { statusMap[s.section_id] = s.status; });
                var stats = stData.stats || {};

                // 获取章节
                var chResp = await fetch(API_BASE + '/books/' + bookId + '/chapters');
                var chData = await chResp.json();
                var chapters = chData.chapters || [];

                // 计算当前用户的思考数量（遍历所有节的思考）
                var thoughtsCount = 0;
                sections.forEach(function(sec) {
                    thoughtsCount += (sec.thoughts || []).length;
                });

                var totalSec = stats.total_sections || sections.length || 0;
                var readSec = stats.read || 0;
                var totalCh = chapters.length;
                var totalWords = sections.reduce(function(sum, s) { return sum + (s.word_count || 0); }, 0);
                var totalAnno = sections.reduce(function(sum, s) { return sum + (s.annotations || []).length; }, 0);
                var wordsStr = totalWords >= 10000 ? (totalWords / 10000).toFixed(1) + '万' : totalWords;

                // 构建节ID -> 评注数映射
                var annoMap = {};
                sections.forEach(function(sec) {
                    annoMap[sec.id] = (sec.annotations || []).length;
                });

                // 保存到state供后续检查使用
                state.catalogSections = sections;
                state.catalogStatusMap = statusMap;

                var container = document.getElementById('catalogContent');
                container.innerHTML = '';

                // 添加统计信息
                var statsDiv = document.createElement('div');
                statsDiv.style.cssText = 'background:#f8f8f5;border-radius:8px;padding:12px 15px;margin-bottom:15px;font-size:14px;color:#666;';
                statsDiv.innerHTML = '本书共：' + totalSec + '节 | ' + wordsStr + '字 | ' + totalAnno + '点评 | 已读' + readSec + '节 | 思考' + thoughtsCount + '条';
                container.appendChild(statsDiv);

                if (chapters.length === 0) {
                    // 无章节，直接列出所有节
                    sections.forEach(function(sec) {
                        var status = statusMap[sec.id] || 'unread';
                        var div = document.createElement('div');
                        div.className = 'catalog-section';
                        div.innerHTML = '<span class="sec-status ' + status + '"></span>' +
                            '<span class="sec-title">第' + sec.section_number + '节 ' + (sec.title || '') + '</span>' +
                            '<span class="sec-info">' +
                            '<span>' + (sec.word_count || 0) + '字</span>' +
                            '<span>点评' + (annoMap[sec.id] || 0) + '</span>' +
                            '</span>';
                        div.onclick = function() { openBookSection(bookId, sec.id, sec.section_number); };
                        container.appendChild(div);
                    });
                } else {
                    // 有章节，按章分组
                    chapters.forEach(function(ch) {
                        var chDiv = document.createElement('div');
                        chDiv.className = 'catalog-chapter';

                        // 该章的节
                        var chSections = sections.filter(function(s) { return s.chapter_id === ch.id; });
                        var chReadCount = chSections.filter(function(s) { return (statusMap[s.id] || '') === 'read'; }).length;
                        var chWords = chSections.reduce(function(sum, s) { return sum + (s.word_count || 0); }, 0);
                        var chAnno = chSections.reduce(function(sum, s) { return sum + (annoMap[s.id] || 0); }, 0);

                        var header = document.createElement('div');
                        header.className = 'catalog-chapter-header';
                        header.innerHTML = '<span class="ch-label">第' + ch.chapter_number + '章 ' + (ch.title || '') + '</span>' +
                            '<span class="ch-stats">' +
                            '<span>' + chSections.length + '节</span>' +
                            '<span>已读' + chReadCount + '节</span>' +
                            '<span>' + chWords + '字</span>' +
                            '<span>点评' + chAnno + '</span>' +
                            '</span>';
                        chDiv.appendChild(header);

                        // 该章下的节（缩进）
                        chSections.forEach(function(sec) {
                            var status = statusMap[sec.id] || 'unread';
                            var secDiv = document.createElement('div');
                            secDiv.className = 'catalog-section';
                            secDiv.innerHTML = '<span class="sec-status ' + status + '"></span>' +
                                '<span class="sec-title">第' + sec.section_number + '节 ' + (sec.title || '') + '</span>' +
                                '<span class="sec-info">' +
                                '<span>' + (sec.word_count || 0) + '字</span>' +
                                '<span>点评' + (annoMap[sec.id] || 0) + '</span>' +
                                '</span>';
                            secDiv.onclick = function() { openBookSection(bookId, sec.id, sec.section_number); };
                            chDiv.appendChild(secDiv);
                        });

                        container.appendChild(chDiv);
                    });
                }

            } catch (e) {
                alert('加载目录失败: ' + e.message);
            } finally { hideLoading(); }
        }

        function openBookSection(bookId, sectionId, sectionNumber) {
            // 免费用户只能读前3节
            if (state.currentUser && state.currentUser.role !== 'admin' && sectionNumber > 3) {
                var subs = state.userSubscriptions || [];
                if (subs.indexOf(bookId) === -1) {
                    if (confirm('免费用户只能阅读前3节。要阅读全文，请联系作者订阅。是否提交订阅申请？')) {
                        fetch(API_BASE + '/books/' + bookId + '/subscribe', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({user_id: state.currentUser.id})
                        }).then(function(r) { return r.json(); }).then(function(d) { alert(d.message || '申请已提交'); });
                    }
                    return;
                }
            }
            // 检查是否是第一节或上一节已读完
            if (sectionNumber > 1) {
                // 找到上一节的状态
                var prevSection = state.catalogSections.find(function(s) { return s.section_number === sectionNumber - 1; });
                if (prevSection && state.catalogStatusMap[prevSection.id] !== 'read') {
                    alert('请先完成第' + (sectionNumber - 1) + '节的阅读，才能继续阅读下一节。');
                    return;
                }
            }
            // 设置阅读状态为"在读"（已读节不重置）
            var currentStatus = (state.catalogStatusMap && state.catalogStatusMap[sectionId]) || '';
            if (currentStatus !== 'read') {
                fetch(API_BASE + '/sections/' + sectionId + '/status', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({book_id: bookId, status: 'reading'})
                });
            }
            // 打开阅读器并跳转到指定节
            openBook(bookId);
            setTimeout(function() {
                for (var i = 0; i < state.currentSections.length; i++) {
                    if (state.currentSections[i].id === sectionId) {
                        state.currentSectionIndex = i;
                        reader.renderCurrentSection();
                        break;
                    }
                }
            }, 500);
        }

        async function loadBooks() {
            try {
                var response = await fetch(API_BASE + '/books');
                var data = await response.json();
                state.books = data.books || [];
                if (state.currentUser && state.currentUser.role !== 'admin') {
                    fetch(API_BASE + '/user/subscriptions?user_id=' + state.currentUser.id).then(function(r) { return r.json(); }).then(function(d) {
                        state.userSubscriptions = d.book_ids || [];
                        renderBookList();
                    });
                    return;
                }
                state.userSubscriptions = [];
                renderBookList();
            } catch (e) { console.error('加载书籍失败:', e); }
        }

        function renderBookList() {
            var container = document.getElementById('bookList');
            if (state.books.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">📖</div><p>还没有书籍，去管理页上传吧</p></div>';
                return;
            }
            container.innerHTML = state.books.map(function(book) {
                var safeTitle = (book.title || '').replace(/[<>"'&]/g, function(c) {
                    return ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'})[c];
                });
                var safeAuthor = (book.author || '').replace(/[<>"'&]/g, function(c) {
                    return ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','&':'&amp;'})[c];
                });
                var rs = book.reading_stats || {};
                var totalSec = rs.total_sections || book.total_sections || 0;
                var readSec = rs.read || 0;
                var totalCh = book.total_chapters || 0;
                var totalWords = book.total_words || 0;
                var totalAnno = book.total_annotations || 0;
                var wordsStr = totalWords >= 10000 ? (totalWords / 10000).toFixed(1) + '万' : totalWords;
                var accessLabel = '';
                if (state.currentUser && state.currentUser.role !== 'admin') {
                    accessLabel = '<span style="color:#FF9800;font-size:11px;">免费</span>';
                }
                return '<div class="book-card" onclick="showBookCatalog(' + book.id + ')">' +
                    '<div class="cover">📚</div>' +
                    '<div class="info">' +
                    '<div class="title">' + safeTitle + '</div>' +
                    '<div class="meta">' + safeAuthor + (book.author_nationality ? ' [' + book.author_nationality + ']' : '') + (book.version ? ' · ' + book.version : '') + '</div>' +
                    '<div class="book-stats-row">' +
                    '<span>' + (totalCh > 0 ? totalCh + '章' : '') + totalSec + '节</span>' +
                    '<span>已读' + readSec + '节</span>' +
                    '<span>' + wordsStr + '字</span>' +
                    '<span>点评' + totalAnno + '</span>' +
                    accessLabel +
                    '</div>' +
                    '</div></div>';
            }).join('');
        }

        async function openBook(bookId) {
            try {
                showLoading('正在加载...');
                var response = await fetch(API_BASE + '/books/' + bookId);
                var data = await response.json();
                if (!response.ok) { alert('加载失败: ' + data.error); return; }

                state.currentBook = data.book;
                state.currentSections = data.sections;
                state.currentProgress = data.progress || null;
                state.currentSectionIndex = 0;

                // 加载节阅读状态（用于判断已读/未读），完成后再渲染
                fetch(API_BASE + '/books/' + bookId + '/reading-status')
                    .then(function(r) { return r.json(); })
                    .then(function(statusData) {
                        if (statusData.statuses) {
                            var statusMap = {};
                            statusData.statuses.forEach(function(s) {
                                statusMap[s.section_id] = s.status;
                            });
                            state.catalogStatusMap = statusMap;
                            console.log('阅读状态已加载:', Object.keys(statusMap).length, '节');
                        }
                    })
                    .catch(function() {})
                    .finally(function() {
                        showPage('readerPage');
                        reader.renderCurrentSection();
                    });
                
                // 调试：检查第一个节的 content
                if (data.sections && data.sections.length > 0) {
                    var firstSection = data.sections[0];
                    console.log('API returned section content length:', firstSection.content.length);
                    console.log('API content[75:95]:', JSON.stringify(firstSection.content.substring(75, 95)));
                }
                state.currentSectionIndex = 0;

                // 设置导航栏标题：书名 + 作者（国籍）
                var bookTitle = data.book.title;
                if (data.book.author) {
                    bookTitle += ' <small style="font-size:12px;color:rgba(255,255,255,0.7);">' + data.book.author;
                    if (data.book.author_nationality) {
                        bookTitle += ' [' + data.book.author_nationality + ']';
                    }
                    bookTitle += '</small>';
                }
                document.getElementById('navbarTitle').innerHTML = bookTitle;

                if (data.progress && data.progress.current_section_id) {
                    var index = state.currentSections.findIndex(function(s) { return s.id === data.progress.current_section_id; });
                    if (index !== -1) state.currentSectionIndex = index;
                }

                // showPage 和 renderCurrentSection 已在 reading-status 加载完成后调用
            } catch (e) {
                alert('加载出错: ' + e.message);
            } finally { hideLoading(); }
        }

        // ===== 阅读器 =====
        var reader = {
            _allChars: [],
            _totalChars: 0,
            _container: null,
            _containerHeight: 0,

            renderCurrentSection: function() {
                var section = state.currentSections[state.currentSectionIndex];
                if (!section) return;

                // 显示节标题：第X节 节名
                document.getElementById('readerSectionTitle').textContent =
                    '第' + (state.currentSectionIndex + 1) + '节 ' + (section.title || '');

                // 加载当前节的点评数据
                state.currentAnnotations = (section.annotations || []).slice();
                // 按 annotation_index 排序
                state.currentAnnotations.sort(function(a, b) { return a.annotation_index - b.annotation_index; });

                // 准备粉笔字
                this._prepareChalkText(section.content);

                // 如果该节已读，直接显示全部文字
                var sectionStatus = (state.catalogStatusMap && state.catalogStatusMap[section.id]) || '';
                if (sectionStatus === 'read') {
                    this.revealAll();
                    document.getElementById('progressFill').style.width = '100%';
                    console.log('节已读，显示全部文字');
                    // 已读节：显示所有点评和小结
                    analysisManager.init();
                    if (section.annotations) {
                        section.annotations.forEach(function(ann) {
                            analysisManager.addAnnotationTab(ann);
                        });
                    }
                    if (section.summary) {
                        analysisManager.addSummaryTab(section.summary);
                    }
                } else {
                    // 未读/在读节：重置赏析区域
                    analysisManager.init();
                    document.getElementById('annotationDisplay').classList.remove('active');
                }

                // 如果有点评，在文字中标记点评序号
                this._renderAnnotationMarkers();

                // 加载用户思考
                if (typeof thoughtEditor !== 'undefined') thoughtEditor.loadThoughts();

                // 加载节的音频时间轴（优先使用预生成音频）
                player.loadSection(section.id);

                // 设置滚动监听
                this.setupScrollListener();

                // 恢复阅读断点位置
                this.restorePosition();

                this.saveProgress();
            },

            _prepareChalkText: function(content) {
                console.log('_prepareChalkText, content length:', content.length);
                console.log('content[80:95]:', JSON.stringify(content.substring(80, 95)));
                var container = document.getElementById('chalkText');
                container.innerHTML = '';
                container.scrollTop = 0;
                this._allChars = [];
                this._content = content;  // 保存原始 content（含\n）

                // 标点符号集合
                var puncts = '\uFF0C\u3002\uFF01\uFF1F\u3001\uFF1B\uFF1A\u201C\u201D\u2018\u2019\uFF08\uFF09\u3010\u3011\u300A\u300B\u2014\u2026\u00B7,.!?\;:\'\"()-[]{}';

                // 按段落分割
                var paragraphs = content.split('\n').filter(function(p) { return p.trim(); });

                var charIndex = 0;

                paragraphs.forEach(function(para, pIdx) {
                    if (pIdx > 0) {
                        var br = document.createElement('div');
                        br.className = 'chalk-linebreak';
                        br.style.height = '10px';
                        container.appendChild(br);
                    }

                    var paraDiv = document.createElement('div');
                    paraDiv.className = 'chalk-line';
                    paraDiv.style.textIndent = '2em';

                    for (var ci = 0; ci < para.length; ci++) {
                        var char = para[ci];
                        var span = document.createElement('span');
                        span.className = 'chalk-char';
                        if (puncts.indexOf(char) >= 0) span.classList.add('punct');
                        span.textContent = char;
                        span.dataset.index = charIndex;
                        paraDiv.appendChild(span);
                        reader._allChars.push(span);
                        charIndex++;
                    }

                    container.appendChild(paraDiv);
                });

                this._totalChars = charIndex;

                this._container = container;
                this._containerHeight = container.clientHeight;

                document.getElementById('progressFill').style.width = '0%';
            },

            // 在文字中渲染点评序号标记（仅在触发后显示）
            _renderAnnotationMarkers: function() {
                // 先清除已有的标记
                var existingMarkers = document.querySelectorAll('.annotation-superscript');
                existingMarkers.forEach(function(m) { m.remove(); });

                // 只为已触发的点评点显示序号
                var annotations = state.currentAnnotations;
                for (var i = 0; i < annotations.length; i++) {
                    var ann = annotations[i];
                    // 只有已触发的点评点才显示序号
                    if (ann._triggered && ann.end_char >= 0 && ann.end_char < this._allChars.length) {
                        var endIdx = ann.end_char;
                        var endCharSpan = this._allChars[endIdx];
                        var sup = document.createElement('span');
                        sup.className = 'annotation-superscript';
                        sup.textContent = getCircledNumber(ann.annotation_index);
                        sup.dataset.annotationId = ann.id;
                        sup.title = ann.comment;
                        // 插入到 end_char 后面
                        endCharSpan.parentNode.insertBefore(sup, endCharSpan.nextSibling);
                    }
                }
            },

            // 显示单个点评点序号（在触发后调用）
            _showAnnotationMarker: function(annotation) {
                if (annotation.end_char >= 0 && annotation.end_char < this._allChars.length) {
                    var endCharSpan = this._allChars[annotation.end_char];
                    var sup = document.createElement('span');
                    sup.className = 'annotation-superscript';
                    sup.textContent = getCircledNumber(annotation.annotation_index);
                    sup.dataset.annotationId = annotation.id;
                    sup.title = annotation.comment;
                    // 插入到 end_char 后面
                    endCharSpan.parentNode.insertBefore(sup, endCharSpan.nextSibling);
                }
            },

            // 显示到第 N 个字符
            revealCharsUpTo: function(index) {
                var target = Math.min(index, this._totalChars);

                for (var i = 0; i < target; i++) {
                    if (!this._allChars[i].classList.contains('visible')) {
                        this._allChars[i].classList.add('visible');
                    }
                }

                // 滚动
                if (target > 0 && target <= this._allChars.length) {
                    var lastChar = this._allChars[target - 1];
                    var charRect = lastChar.getBoundingClientRect();
                    var containerRect = this._container.getBoundingClientRect();

                    if (charRect.bottom > containerRect.bottom - 10) {
                        var scrollAmount = charRect.bottom - containerRect.bottom + 50;
                        this._container.scrollTop += scrollAmount;
                    }
                }

                // 更新进度
                var percent = this._totalChars ? (target / this._totalChars) * 100 : 0;
                document.getElementById('progressFill').style.width = percent + '%';

                // 检查是否到达某个点评点的 end_char 位置
                this._checkAnnotationTrigger(target);
            },

            // 检查是否触发点评播放
            _checkAnnotationTrigger: function(currentCharIndex) {
                if (state.isPlayingAnnotation) return; // 正在播放点评中，不重复触发

                var annotations = state.currentAnnotations;
                for (var i = 0; i < annotations.length; i++) {
                    var ann = annotations[i];
                    if (!ann._triggered && currentCharIndex >= ann.end_char) {
                        ann._triggered = true;
                        // 立即设置标志，防止句子结束后继续朗读
                        state.isPlayingAnnotation = true;
                        // 使用闭包保存当前的 annotation 引用
                        (function(triggeredAnn) {
                            // 停顿1秒后再触发点评播放
                            setTimeout(function() {
                                player._triggerAnnotationPlayback(triggeredAnn);
                            }, 1000);
                        })(ann);
                        break; // 一次只处理一个点评
                    }
                }
            },

            // 高亮点评原文
            _highlightAnnotation: function(annotation) {
                console.log('_highlightAnnotation:', JSON.stringify({
                    id: annotation.id,
                    start_char: annotation.start_char,
                    end_char: annotation.end_char,
                    original_text: annotation.original_text
                }));
                var startIdx = this._contentCharToDisplayChar(annotation.start_char);
                var endIdx = this._contentCharToDisplayChar(annotation.end_char);
                console.log('Highlight range:', startIdx, '->', endIdx, 'allChars length:', this._allChars.length);
                console.log('_allChars[' + startIdx + ']:', this._allChars[startIdx] ? this._allChars[startIdx].textContent : 'N/A');
                console.log('_allChars[' + (endIdx-1) + ']:', this._allChars[endIdx-1] ? this._allChars[endIdx-1].textContent : 'N/A');
                // end_char 是 Python 切片风格（不包含），所以用 < 而不是 <=
                for (var i = startIdx; i < endIdx && i < this._allChars.length; i++) {
                    this._allChars[i].classList.add('annotated');
                }
            },

            // 清除点评高亮
            _clearAnnotationHighlight: function(annotation) {
                if (!annotation) return;
                var startIdx = this._contentCharToDisplayChar(annotation.start_char);
                var endIdx = this._contentCharToDisplayChar(annotation.end_char);
                // end_char 是 Python 切片风格（不包含），所以用 < 而不是 <=
                for (var i = startIdx; i < endIdx && i < this._allChars.length; i++) {
                    this._allChars[i].classList.remove('annotated');
                }
            },

            // 将 content 字符位置（含\n）转换为 _allChars 索引（不含\n）
            _contentCharToDisplayChar: function(contentCharIdx) {
                if (!this._content) return contentCharIdx;
                var newlineCount = 0;
                for (var i = 0; i < contentCharIdx && i < this._content.length; i++) {
                    if (this._content[i] === '\n') newlineCount++;
                }
                var result = contentCharIdx - newlineCount;
                console.log('_contentCharToDisplayChar:', contentCharIdx, '->', result, '(newlines:', newlineCount, ')');
                return result;
            },

            // 显示全部文字
            revealAll: function() {
                this._allChars.forEach(function(c) { c.classList.add('visible'); });
                document.getElementById('progressFill').style.width = '100%';
                this._container.scrollTop = this._container.scrollHeight;
            },

            // 清除所有文字显示
            hideAll: function() {
                this._allChars.forEach(function(c) { c.classList.remove('visible'); });
                // 清除点评高亮
                this._allChars.forEach(function(c) { c.classList.remove('annotated'); });
                // 清除点评序号标记
                var existingMarkers = document.querySelectorAll('.annotation-superscript');
                existingMarkers.forEach(function(m) { m.remove(); });
                if (this._container) this._container.scrollTop = 0;
                document.getElementById('progressFill').style.width = '0%';
                // 重置点评触发状态
                state.currentAnnotations.forEach(function(ann) { ann._triggered = false; });
                // 隐藏点评显示区域
                document.getElementById('annotationDisplay').classList.remove('active');
                // 重置赏析区域
                analysisManager.reset();
            },

            prevSection: function() {
                if (state.currentSectionIndex > 0) {
                    state.currentSectionIndex--;
                    this.renderCurrentSection();
                }
            },

            nextSection: function() {
                if (state.currentSectionIndex < state.currentSections.length - 1) {
                    state.currentSectionIndex++;
                    this.renderCurrentSection();
                }
            },

            saveProgress: function(position) {
                var section = state.currentSections[state.currentSectionIndex];
                if (!section) return;
                var pos = position !== undefined ? position : this._currentPosition || 0;
                fetch(API_BASE + '/progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_id: state.currentBook.id, section_id: section.id, position: pos })
                }).catch(function(e) { console.error('保存进度失败:', e); });
            },

            _currentPosition: 0,
            _scrollListener: null,
            _saveTimer: null,

            setupScrollListener: function() {
                var self = this;
                var container = document.getElementById('chalkboard');
                if (this._scrollListener) {
                    container.removeEventListener('scroll', this._scrollListener);
                }
                if (this._saveTimer) {
                    clearInterval(this._saveTimer);
                }
                this._scrollListener = function() {
                    var scrollTop = container.scrollTop;
                    var scrollHeight = container.scrollHeight;
                    var clientHeight = container.clientHeight;
                    // 计算当前已读字数
                    var scrollPercent = scrollHeight > clientHeight ? scrollTop / (scrollHeight - clientHeight) : 0;
                    self._currentPosition = Math.floor(self._totalChars * scrollPercent);
                    document.getElementById('progressFill').style.width = (scrollPercent * 100) + '%';
                    // 已读字数等于总字数时，标记为已读
                    if (self._currentPosition >= self._totalChars) {
                        self.markSectionRead();
                    }
                };
                container.addEventListener('scroll', this._scrollListener);
                // 每3秒自动保存一次阅读断点
                this._saveTimer = setInterval(function() {
                    if (self._currentPosition > 0) {
                        self.saveProgress(self._currentPosition);
                    }
                }, 3000);
            },

            markSectionRead: function() {
                var section = state.currentSections[state.currentSectionIndex];
                if (!section) return;
                // 检查是否已标记为已读（本次会话）
                if (section._markedRead) return;
                // 检查该节是否已经是"已读"状态（之前已读过）
                var sectionStatus = (state.catalogStatusMap && state.catalogStatusMap[section.id]) || '';
                if (sectionStatus === 'read') {
                    section._markedRead = true;  // 标记为已处理，避免重复检查
                    return;
                }
                section._markedRead = true;
                // 调用API设置状态为已读
                fetch(API_BASE + '/sections/' + section.id + '/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ book_id: state.currentBook.id, status: 'read' })
                }).then(function() {
                    console.log('已标记为已读: 第' + section.section_number + '节');
                    // 更新本地状态
                    if (state.catalogStatusMap) {
                        state.catalogStatusMap[section.id] = 'read';
                    }
                }).catch(function(e) { console.error('标记已读失败:', e); });
            },

            restorePosition: function() {
                var self = this;
                var section = state.currentSections[state.currentSectionIndex];
                if (!section || !state.currentProgress) return;
                // 只对保存断点的那一节恢复位置
                if (state.currentProgress.current_section_id !== section.id) return;
                // 已读节不恢复位置（保持全部显示或从头开始）
                var sectionStatus = (state.catalogStatusMap && state.catalogStatusMap[section.id]) || '';
                if (sectionStatus === 'read') return;
                var savedPosition = state.currentProgress.current_position || 0;
                if (savedPosition <= 0) return;
                setTimeout(function() {
                    var container = document.getElementById('chalkboard');
                    if (!container || self._totalChars <= 0) return;
                    // 恢复已显示的文字到上次阅读位置
                    self.revealCharsUpTo(savedPosition);
                    // 恢复滚动位置
                    var scrollPercent = savedPosition / self._totalChars;
                    scrollPercent = Math.min(scrollPercent, 1);
                    var scrollTarget = scrollPercent * (container.scrollHeight - container.clientHeight);
                    container.scrollTop = scrollTarget;
                    self._currentPosition = savedPosition;
                    document.getElementById('progressFill').style.width = (scrollPercent * 100) + '%';
                    console.log('恢复阅读位置:', savedPosition, '/', self._totalChars);
                }, 100);
            }
        };

        // ===== 赏析区域管理器 =====
        var analysisManager = {
            tabs: [
                { id: 'famous', label: '名言赏析', content: '' }
            ],
            currentTab: 'famous',
            rotationTimer: null,
            isRotating: false,

            // 初始化
            init: function() {
                this.tabs = [{ id: 'famous', label: '名言赏析', content: '世界上最快而又最慢，最长而又最短，最平凡而又最珍贵，最易被忽视而又最令人后悔的就是时间。——高尔基《童年》' }];
                this.currentTab = 'famous';
                this.stopRotation();
                this.renderTabs();
                this.showTab('famous');
            },

            // 添加点评标签
            addAnnotationTab: function(annotation) {
                var tabId = 'annotation_' + annotation.id;
                var tabLabel = '点评' + getCircledNumber(annotation.annotation_index);
                
                // 检查是否已存在
                var exists = this.tabs.some(function(t) { return t.id === tabId; });
                if (exists) return;

                // 点评内容：原文在前（金色），点评在后（白色）
                var contentHtml = '<div class="original-text">「' + annotation.original_text + '」</div>' +
                                  '<div class="comment-text">' + annotation.comment + '</div>';

                this.tabs.push({
                    id: tabId,
                    label: tabLabel,
                    content: contentHtml,
                    annotationId: annotation.id,
                    isHtml: true
                });

                // 添加点评时暂停轮巡
                this.stopRotation();
                this.renderTabs();
                this.showTab(tabId);
            },

            // 添加梗概小结标签
            addSummaryTab: function(summary) {
                var tabId = 'summary';
                var exists = this.tabs.some(function(t) { return t.id === tabId; });
                if (exists) return;

                this.tabs.push({
                    id: tabId,
                    label: '小结',
                    content: summary,
                    isSummary: true
                });

                this.renderTabs();
                this.showTab(tabId);
                // 小结标签也参与轮巡，从当前标签开始轮巡
                if (this.tabs.length > 1) {
                    this.stopRotation();
                    this.startRotationFrom(tabId);
                }
            },

            // 渲染标签
            renderTabs: function() {
                var tabsContainer = document.getElementById('analysisTabs');
                tabsContainer.innerHTML = '';

                var self = this;
                this.tabs.forEach(function(tab) {
                    var tabEl = document.createElement('div');
                    tabEl.className = 'tab' + (tab.id === self.currentTab ? ' active' : '') + (tab.isSummary ? ' summary-tab' : '');
                    tabEl.textContent = tab.label;
                    tabEl.onclick = function() {
                        // 点击标签切换到该标签，并作为轮巡起点
                        self.showTab(tab.id);
                        // 如果有多个标签，重新开始轮巡（从当前点击的标签开始）
                        if (self.tabs.length > 1) {
                            self.stopRotation();
                            self.startRotationFrom(tab.id);
                        }
                    };
                    tabsContainer.appendChild(tabEl);
                });
            },

            // 从指定标签开始轮巡
            startRotationFrom: function(startTabId) {
                if (this.rotationTimer) return;
                this.isRotating = true;
                this.currentTab = startTabId;

                var self = this;
                this.rotationTimer = setInterval(function() {
                    var currentIndex = self.tabs.findIndex(function(t) { return t.id === self.currentTab; });
                    var nextIndex = (currentIndex + 1) % self.tabs.length;
                    self.showTab(self.tabs[nextIndex].id);
                }, 10000); // 10秒切换
            },

            // 显示指定标签内容
            showTab: function(tabId) {
                this.currentTab = tabId;
                var tab = this.tabs.find(function(t) { return t.id === tabId; });
                
                if (tab) {
                    var contentEl = document.getElementById('analysisContent');
                    if (tab.isHtml) {
                        contentEl.innerHTML = tab.content;
                    } else {
                        contentEl.textContent = tab.content;
                    }
                }

                this.renderTabs();
            },

            // 开始轮巡
            startRotation: function() {
                this.startRotationFrom(this.currentTab);
            },

            // 停止轮巡
            stopRotation: function() {
                if (this.rotationTimer) {
                    clearInterval(this.rotationTimer);
                    this.rotationTimer = null;
                }
                this.isRotating = false;
            },

            // 点评阅读完，继续原文时恢复轮巡
            resumeRotation: function() {
                if (this.tabs.length > 1 && !this.isRotating) {
                    this.startRotationFrom(this.currentTab);
                }
            },

            // 重置
            reset: function() {
                this.stopRotation();
                this.init();
            }
        };

        // ===== 时间轴播放器 =====
        var player = {
            audio: document.getElementById('audioPlayer'),
            mode: 'timeline', // 'timeline' | 'browser_tts'
            
            // 时间轴数据
            audioUrl: null,
            audioDuration: 0,
            charTimeline: [], // 每个字符显示的时间点
            
            // 播放状态
            isPlaying: false,
            currentTime: 0,
            
            // 浏览器 TTS 备用
            _ttsSentences: [],
            _ttsSentenceIndex: 0,
            _browserTTSSupported: false,

            init: function() {
                this._browserTTSSupported = 'speechSynthesis' in window && window.speechSynthesis;
                var self = this;
                
                // 音频时间更新
                this.audio.ontimeupdate = function() {
                    self.currentTime = self.audio.currentTime;
                    self._updateDisplayByTime();
                };
                
                this.audio.onended = function() {
                    self.isPlaying = false;
                    state.isPlaying = false;
                    document.getElementById('playBtn').textContent = '\u25B6';
                    self.onAudioEnd();
                };
                
                this.audio.onerror = function() {
                    console.error('音频播放错误');
                    self.isPlaying = false;
                    state.isPlaying = false;
                    document.getElementById('playBtn').textContent = '\u25B6';
                };
            },

            // 加载节的音频时间轴
            loadSection: function(sectionId) {
                var self = this;
                
                // 先尝试加载预生成的时间轴音频
                fetch(API_BASE + '/sections/' + sectionId + '/audio-timeline')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.audio_path && data.char_timeline && data.char_timeline.length > 0) {
                            // 使用时间轴模式
                            self.mode = 'timeline';
                            self.audioUrl = data.audio_path;
                            self.audioDuration = data.audio_duration || 0;
                            self.charTimeline = data.char_timeline || [];
                            self.audio.src = self.audioUrl;
                            console.log('加载时间轴音频:', self.audioUrl, '时长:', self.audioDuration);
                        } else if (self._browserTTSSupported) {
                            // 浏览器支持 TTS，降级使用
                            self._useBrowserTTS();
                        } else {
                            // 浏览器不支持 TTS，标记需要服务端生成
                            self.mode = 'server_tts';
                            self.audioUrl = null;
                            console.log('无预生成音频，浏览器不支持TTS，将在播放时按需生成');
                        }
                    })
                    .catch(function() {
                        if (self._browserTTSSupported) {
                            self._useBrowserTTS();
                        } else {
                            self.mode = 'server_tts';
                            self.audioUrl = null;
                        }
                    });
            },

            _useBrowserTTS: function() {
                this.mode = 'browser_tts';
                this.audioUrl = null;
                var section = state.currentSections[state.currentSectionIndex];
                if (section) {
                    this._ttsSentences = section.content.split(/([。！？\n]+)/).filter(function(s) { return s.trim(); });
                    this._ttsSentences = this._ttsSentences.reduce(function(acc, cur, i) {
                        if (i % 2 === 0) acc.push(cur);
                        else if (acc.length > 0) acc[acc.length - 1] += cur;
                        return acc;
                    }, []);
                }
                this._ttsSentenceIndex = 0;
            },

            toggle: function() {
                if (this.isPlaying) { this.pause(); } else { this.play(); }
            },

            play: function() {
                // 检查是否需要从头开始（已读节再次播放时）
                var section = state.currentSections[state.currentSectionIndex];
                var sectionStatus = (state.catalogStatusMap && state.catalogStatusMap[section.id]) || '';
                console.log('play: section.id=', section ? section.id : 'N/A', 'sectionStatus=', sectionStatus, 'catalogStatusMap=', state.catalogStatusMap);
                if (sectionStatus === 'read') {
                    // 已读节，隐藏所有文字，从头开始
                    console.log('已读节再次播放，hideAll前 visible数:', document.querySelectorAll('.chalk-char.visible').length);
                    reader.hideAll();
                    console.log('已读节再次播放，hideAll后 visible数:', document.querySelectorAll('.chalk-char.visible').length);
                    console.log('已读节再次播放，_allChars数:', reader._allChars ? reader._allChars.length : 0);
                    if (this.audio) this.audio.currentTime = 0;
                }
                
                if (this.mode === 'timeline' && this.audioUrl) {
                    console.log('播放模式: timeline, audioUrl:', this.audioUrl);
                    this.audio.play();
                    this.isPlaying = true;
                    state.isPlaying = true;
                    document.getElementById('playBtn').textContent = '\u23F8';
                } else if (this.mode === 'server_tts') {
                    console.log('播放模式: server_tts');
                    // 按需生成音频
                    this._playServerTTS();
                } else {
                    console.log('播放模式: browser_tts');
                    this._playBrowserTTS();
                }
            },
            
            // 重置到开头（用于已读节再次播放）
            resetToStart: function() {
                // 隐藏所有文字（使用 reader._allChars）
                if (reader._allChars && reader._allChars.length > 0) {
                    for (var i = 0; i < reader._allChars.length; i++) {
                        reader._allChars[i].classList.remove('visible');
                    }
                    // 清除点评高亮
                    for (var i = 0; i < reader._allChars.length; i++) {
                        reader._allChars[i].classList.remove('annotated');
                    }
                }
                // 重置 reader 的位置
                reader._currentPosition = 0;
                document.getElementById('progressFill').style.width = '0%';
                // 滚动到顶部
                var container = document.getElementById('chalkboard');
                if (container) container.scrollTop = 0;
                // 重置音频
                if (this.audio) {
                    this.audio.currentTime = 0;
                }
                // 重置点评触发状态
                if (state.currentAnnotations) {
                    state.currentAnnotations.forEach(function(ann) { ann._triggered = false; });
                }
                // 隐藏点评显示区域
                document.getElementById('annotationDisplay').classList.remove('active');
                // 重置赏析区域
                if (typeof analysisManager !== 'undefined') {
                    analysisManager.init();
                }
                console.log('已重置到开头，文字数:', reader._allChars ? reader._allChars.length : 0);
            },

            pause: function() {
                if (this.mode === 'timeline') {
                    this.audio.pause();
                } else {
                    window.speechSynthesis.cancel();
                }
                this.isPlaying = false;
                state.isPlaying = false;
                document.getElementById('playBtn').textContent = '\u25B6';
            },

            stop: function() {
                this.audio.pause();
                this.audio.currentTime = 0;
                window.speechSynthesis.cancel();
                this.isPlaying = false;
                state.isPlaying = false;
                this.currentTime = 0;
                document.getElementById('playBtn').textContent = '\u25B6';
            },

            // 根据当前时间更新文字显示
            _updateDisplayByTime: function() {
                if (!this.charTimeline || this.charTimeline.length === 0) return;
                
                var time = this.currentTime;
                var charIndex = 0;
                
                // 找到当前时间对应的字符索引
                for (var i = 0; i < this.charTimeline.length; i++) {
                    if (this.charTimeline[i] > time) {
                        charIndex = i;
                        break;
                    }
                    charIndex = i + 1;
                }
                
                // 更新文字显示
                reader.revealCharsUpTo(charIndex);
                
                // 更新进度条
                if (this.audioDuration > 0) {
                    var percent = (time / this.audioDuration) * 100;
                    document.getElementById('progressFill').style.width = percent + '%';
                }
            },

            // ===== 服务端按需生成音频（百度TTS）=====
            _playServerTTS: function() {
                var self = this;
                var section = state.currentSections[state.currentSectionIndex];
                if (!section) return;

                document.getElementById('playBtn').textContent = '\u23F3';

                // 调用后端生成音频和时间轴
                fetch(API_BASE + '/sections/' + section.id + '/generate-audio', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                }).then(function(r) { return r.json(); }).then(function(data) {
                    if (data.success) {
                        // 生成成功，重新加载时间轴
                        self.loadSection(section.id);
                        // 等待加载完成后自动播放
                        setTimeout(function() {
                            if (self.mode === 'timeline' && self.audioUrl) {
                                self.audio.play();
                                self.isPlaying = true;
                                state.isPlaying = true;
                                document.getElementById('playBtn').textContent = '\u23F8';
                            } else {
                                document.getElementById('playBtn').textContent = '\u25B6';
                                alert('音频加载失败，请重试');
                            }
                        }, 500);
                    } else {
                        document.getElementById('playBtn').textContent = '\u25B6';
                        alert('语音合成失败: ' + (data.error || '未知错误') + '\n\n请确认管理员已配置百度TTS密钥。');
                    }
                }).catch(function(e) {
                    document.getElementById('playBtn').textContent = '\u25B6';
                    alert('语音合成请求失败: ' + e.message);
                });
            },

            _playBrowserTTS: function() {
                if (!this._browserTTSSupported) {
                    alert('您的浏览器不支持语音朗读功能');
                    return;
                }
                
                window.speechSynthesis.cancel();
                this._speakCurrentSentence();
                this.isPlaying = true;
                state.isPlaying = true;
                document.getElementById('playBtn').textContent = '\u23F8';
            },

            _speakCurrentSentence: function() {
                if (this._ttsSentenceIndex >= this._ttsSentences.length) {
                    this.onAudioEnd();
                    return;
                }
                
                var sentence = this._ttsSentences[this._ttsSentenceIndex];
                var utterance = new SpeechSynthesisUtterance(sentence);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                
                var self = this;
                utterance.onend = function() {
                    if (!self.isPlaying) return;
                    self._ttsSentenceIndex++;
                    self._speakCurrentSentence();
                };
                
                window.speechSynthesis.speak(utterance);
            },

            onAudioEnd: function() {
                this.isPlaying = false;
                state.isPlaying = false;
                document.getElementById('playBtn').textContent = '\u25B6';
                
                // 标记已读
                var section = state.currentSections[state.currentSectionIndex];
                if (section && state.currentBook) {
                    fetch(API_BASE + '/sections/' + section.id + '/status', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({book_id: state.currentBook.id, status: 'read'})
                    }).catch(function() {});
                }
                
                // 显示梗概小结
                var self = this;
                setTimeout(function() {
                    self._generateAndShowSummary();
                }, 2000);
            },

            _generateAndShowSummary: function() {
                var section = state.currentSections[state.currentSectionIndex];
                if (!section || !section.summary) return;
                
                analysisManager.addSummaryTab(section.summary);
                
                // 如果还有下一节，自动切换
                if (state.currentSectionIndex < state.currentSections.length - 1) {
                    setTimeout(function() { reader.nextSection(); }, 3000);
                }
            }
        };

        // ===== 点评编辑器 =====
        var annotationEditor = {
            _selectStartIndex: -1,
            _selectEndIndex: -1,
            _isSelecting: false,

            toggleEditMode: function() {
                if (state.isAnnotationEditMode) {
                    this.exitEditMode();
                } else {
                    this.enterEditMode();
                }
            },

            enterEditMode: function() {
                // 如果正在播放，先暂停
                if (state.isPlaying) {
                    player.pause();
                }

                state.isAnnotationEditMode = true;
                var btn = document.getElementById('editAnnotationBtn');
                btn.classList.add('active');
                btn.textContent = '退出编辑';

                // 让所有已显示的文字可选
                var allChars = reader._allChars;
                for (var i = 0; i < allChars.length; i++) {
                    allChars[i].classList.add('selectable');
                    allChars[i].addEventListener('click', this._onCharClick);
                }
            },

            exitEditMode: function() {
                state.isAnnotationEditMode = false;
                var btn = document.getElementById('editAnnotationBtn');
                btn.classList.remove('active');
                btn.textContent = '编辑点评';

                // 移除可选状态和事件
                var allChars = reader._allChars;
                for (var i = 0; i < allChars.length; i++) {
                    allChars[i].classList.remove('selectable');
                    allChars[i].classList.remove('selected');
                    allChars[i].removeEventListener('click', this._onCharClick);
                }

                this._selectStartIndex = -1;
                this._selectEndIndex = -1;
                this._isSelecting = false;
            },

            _onCharClick: function(e) {
                var charSpan = e.target;
                if (!charSpan.classList.contains('chalk-char')) return;

                var index = parseInt(charSpan.dataset.index, 10);
                if (isNaN(index)) return;

                if (!annotationEditor._isSelecting) {
                    // 第一次点击：选择起始字
                    annotationEditor._clearSelection();
                    annotationEditor._selectStartIndex = index;
                    annotationEditor._selectEndIndex = index;
                    annotationEditor._isSelecting = true;
                    charSpan.classList.add('selected');
                } else {
                    // 第二次点击：选择结束字
                    annotationEditor._selectEndIndex = index;
                    annotationEditor._isSelecting = false;

                    // 确保 start <= end
                    var start = Math.min(annotationEditor._selectStartIndex, annotationEditor._selectEndIndex);
                    var end = Math.max(annotationEditor._selectStartIndex, annotationEditor._selectEndIndex);

                    // 高亮选中区域
                    annotationEditor._highlightSelection(start, end);

                    // 弹出输入框
                    annotationEditor._showModal(start, end);
                }
            },

            _clearSelection: function() {
                var allChars = reader._allChars;
                for (var i = 0; i < allChars.length; i++) {
                    allChars[i].classList.remove('selected');
                }
            },

            _highlightSelection: function(start, end) {
                this._clearSelection();
                for (var i = start; i <= end && i < reader._allChars.length; i++) {
                    reader._allChars[i].classList.add('selected');
                }
            },

            _showModal: function(start, end) {
                // 获取选中的原文
                var originalText = '';
                for (var i = start; i <= end && i < reader._allChars.length; i++) {
                    originalText += reader._allChars[i].textContent;
                }

                document.getElementById('annotationSelectedText').textContent = originalText;
                document.getElementById('annotationInput').value = '';
                document.getElementById('annotationModalOverlay').classList.add('active');

                // 存储选中的范围
                this._pendingStart = start;
                this._pendingEnd = end;
                this._pendingOriginalText = originalText;

                // 聚焦输入框
                setTimeout(function() {
                    document.getElementById('annotationInput').focus();
                }, 100);
            },

            cancelModal: function() {
                document.getElementById('annotationModalOverlay').classList.remove('active');
                this._clearSelection();
                this._selectStartIndex = -1;
                this._selectEndIndex = -1;
                this._isSelecting = false;
            },

            saveAnnotation: function() {
                var comment = document.getElementById('annotationInput').value.trim();
                if (!comment) {
                    alert('请输入点评内容');
                    return;
                }

                var section = state.currentSections[state.currentSectionIndex];
                if (!section) return;

                var self = this;
                var start = this._pendingStart;
                var end = this._pendingEnd;
                var originalText = this._pendingOriginalText;

                // 计算点评序号
                var nextIndex = state.currentAnnotations.length + 1;

                fetch(API_BASE + '/sections/' + section.id + '/annotations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start_char: start,
                        end_char: end,
                        original_text: originalText,
                        comment: comment
                    })
                })
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (data.error) {
                        alert('保存点评失败: ' + data.error);
                        return;
                    }

                    // 使用后端返回的 annotation_index，如果没有则用本地计算的
                    var newAnnotation = {
                        id: data.id || data.annotation_id || Date.now(),
                        annotation_index: data.annotation_index || nextIndex,
                        start_char: start,
                        end_char: end,
                        original_text: originalText,
                        comment: comment
                    };

                    state.currentAnnotations.push(newAnnotation);
                    state.currentAnnotations.sort(function(a, b) { return a.annotation_index - b.annotation_index; });

                    // 重新渲染点评标记
                    reader._renderAnnotationMarkers();

                    // 关闭弹窗
                    self.cancelModal();

                    alert('点评保存成功！');
                })
                .catch(function(e) {
                    alert('保存点评出错: ' + e.message);
                });
            }
        };

        var thoughtEditor = {
            isEditMode: false,
            _startChar: -1,
            _endChar: -1,

            toggleEditMode: function() {
                if (this.isEditMode) {
                    this.exitEditMode();
                } else {
                    this.enterEditMode();
                }
            },

            enterEditMode: function() {
                this.isEditMode = true;
                player.pause();
                var btn = document.getElementById('editAnnotationBtn');
                if (btn) btn.textContent = '✓ 完成思考';
                // 让已显示的文字可点击
                var chars = document.querySelectorAll('.chalk-char.visible');
                chars.forEach(function(c) {
                    c.classList.add('selectable');
                    c.addEventListener('click', thoughtEditor._onCharClick);
                });
            },

            exitEditMode: function() {
                this.isEditMode = false;
                this._startChar = -1;
                this._endChar = -1;
                var btn = document.getElementById('editAnnotationBtn');
                if (btn) btn.textContent = '💡 添加思考';
                var chars = document.querySelectorAll('.chalk-char.selectable');
                chars.forEach(function(c) {
                    c.classList.remove('selectable', 'selected');
                    c.removeEventListener('click', thoughtEditor._onCharClick);
                });
            },

            _onCharClick: function(e) {
                var charSpan = e.currentTarget;
                var charIndex = parseInt(charSpan.dataset.index);
                if (thoughtEditor._startChar === -1) {
                    thoughtEditor._startChar = charIndex;
                    thoughtEditor._highlightSelection(charIndex, charIndex);
                } else {
                    thoughtEditor._endChar = charIndex;
                    var start = Math.min(thoughtEditor._startChar, thoughtEditor._endChar);
                    var end = Math.max(thoughtEditor._startChar, thoughtEditor._endChar);
                    thoughtEditor._highlightSelection(start, end);
                    thoughtEditor._showModal(start, end);
                }
            },

            _highlightSelection: function(start, end) {
                // 清除之前的高亮
                document.querySelectorAll('.chalk-char.thought-selected').forEach(function(c) {
                    c.classList.remove('thought-selected');
                });
                reader._allChars.forEach(function(c, i) {
                    if (i >= start && i <= end) c.classList.add('thought-selected');
                });
            },

            _showModal: function(start, end) {
                var originalText = '';
                for (var i = start; i <= end && i < reader._allChars.length; i++) {
                    originalText += reader._allChars[i].textContent;
                }
                var modal = document.getElementById('thoughtModalOverlay');
                document.getElementById('thoughtOriginalText').textContent = originalText;
                document.getElementById('thoughtContent').value = '';
                document.getElementById('thoughtStartChar').value = start;
                document.getElementById('thoughtEndChar').value = end;
                modal.style.display = 'flex';
            },

            saveThought: function() {
                var section = state.currentSections[state.currentSectionIndex];
                if (!section || !state.currentUser) { alert('请先登录'); return; }
                var content = document.getElementById('thoughtContent').value.trim();
                if (!content) { alert('请输入思考内容'); return; }
                var startChar = parseInt(document.getElementById('thoughtStartChar').value);
                var endChar = parseInt(document.getElementById('thoughtEndChar').value);
                var originalText = document.getElementById('thoughtOriginalText').textContent;
                fetch(API_BASE + '/sections/' + section.id + '/thoughts', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: state.currentUser.id,
                        start_char: startChar, end_char: endChar,
                        original_text: originalText, content: content
                    })
                }).then(function(r) { return r.json(); }).then(function(data) {
                    if (data.thought_id) {
                        alert('思考已保存');
                        thoughtEditor.exitEditMode();
                        thoughtEditor._closeModal();
                        thoughtEditor.loadThoughts();
                    } else {
                        alert(data.error || '保存失败');
                    }
                });
            },

            _closeModal: function() {
                document.getElementById('thoughtModalOverlay').style.display = 'none';
                this._startChar = -1;
                this._endChar = -1;
                document.querySelectorAll('.chalk-char.thought-selected').forEach(function(c) {
                    c.classList.remove('thought-selected');
                });
            },

            loadThoughts: function() {
                var section = state.currentSections[state.currentSectionIndex];
                if (!section || !state.currentUser) return;
                var url = API_BASE + '/sections/' + section.id + '/thoughts?user_id=' + state.currentUser.id;
                fetch(url).then(function(r) { return r.json(); }).then(function(data) {
                    // 清除旧的气泡
                    document.querySelectorAll('.thought-bubble').forEach(function(b) { b.remove(); });
                    (data.thoughts || []).forEach(function(t) {
                        thoughtEditor._addBubble(t);
                    });
                });
            },

            _addBubble: function(thought) {
                var endIdx = thought.end_char;
                if (endIdx < 0 || endIdx >= reader._allChars.length) return;
                var endCharSpan = reader._allChars[endIdx];
                var bubble = document.createElement('span');
                bubble.className = 'thought-bubble';
                bubble.textContent = '💭';
                bubble.title = thought.content;
                bubble.dataset.thoughtId = thought.id;
                bubble.onclick = function(e) {
                    e.stopPropagation();
                    thoughtEditor._showDetail(thought);
                };
                endCharSpan.parentNode.insertBefore(bubble, endCharSpan.nextSibling);
            },

            _showDetail: function(thought) {
                var content = thought.content || '';
                var original = thought.original_text || '';
                alert('【我的思考】\n原文：' + original + '\n\n思考：' + content);
            }
        };

        // ===== 用户系统 =====
        function doLogin() {
            var phone = document.getElementById('loginPhone').value.trim();
            var authCode = document.getElementById('loginAuthCode').value.trim();
            var errEl = document.getElementById('loginError');
            if (!phone || !authCode) { errEl.textContent = '请输入手机号和授权码'; errEl.style.display = 'block'; return; }
            errEl.style.display = 'none';
            // 先尝试登录
            fetch(API_BASE + '/auth/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: phone, auth_code: authCode})
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.user) {
                    onLoginSuccess(data.user);
                } else {
                    // 登录失败，尝试注册
                    fetch(API_BASE + '/auth/register', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({phone: phone, auth_code: authCode})
                    }).then(function(r2) { return r2.json(); }).then(function(data2) {
                        if (data2.user) {
                            onLoginSuccess(data2.user);
                        } else {
                            errEl.textContent = data2.error || '注册失败'; errEl.style.display = 'block';
                        }
                    });
                }
            }).catch(function(e) { errEl.textContent = '网络错误'; errEl.style.display = 'block'; });
        }

        function onLoginSuccess(user) {
            state.currentUser = user;
            localStorage.setItem('userId', user.id);
            // 系统用户显示管理按钮
            if (user.role === 'admin') {
                document.getElementById('adminBtn').style.display = '';
            } else {
                document.getElementById('adminBtn').style.display = 'none';
            }
            document.getElementById('logoutBtn').style.display = '';
            showPage('homePage');
            loadBooks();
        }

        function logout() {
            state.currentUser = null;
            localStorage.removeItem('userId');
            document.getElementById('adminBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('loginPhone').value = '';
            document.getElementById('loginAuthCode').value = '';
            showPage('loginPage');
        }

        function checkLogin() {
            var userId = localStorage.getItem('userId');
            if (userId) {
                fetch(API_BASE + '/auth/check?user_id=' + userId).then(function(r) { return r.json(); }).then(function(data) {
                    if (data.user) {
                        onLoginSuccess(data.user);
                    } else {
                        showPage('loginPage');
                    }
                }).catch(function() { showPage('loginPage'); });
            } else {
                showPage('loginPage');
            }
        }

            if (pageId === 'readerPage') {
                // 阅读页隐藏管理按钮
                document.getElementById('adminBtn').style.display = 'none';
                // 显示返回按钮
                document.getElementById('backBtn').style.display = 'block';
                // 标题已在 openBook 中设置
            } else if (pageId === 'catalogPage') {
                // 目录页显示返回按钮，隐藏管理按钮
                document.getElementById('backBtn').style.display = 'block';
                document.getElementById('adminBtn').style.display = 'none';
                // 标题由 showBookCatalog 设置，这里不覆盖
            } else {
                // 其他页面隐藏返回按钮
                document.getElementById('backBtn').style.display = 'none';
                // 非阅读页恢复默认标题
                document.getElementById('navbarTitle').innerHTML = '伴读书童';
                // 书架页显示管理按钮（系统用户）
                if (pageId === 'homePage' && state.currentUser && state.currentUser.role === 'admin') {
                    document.getElementById('adminBtn').style.display = '';
                } else {
                    document.getElementById('adminBtn').style.display = 'none';
                }
            }

            // 管理页面显示"返回书架"按钮，隐藏管理按钮
            if (pageId === 'adminPage') {
                document.getElementById('homeBtn').style.display = '';
                document.getElementById('adminBtn').style.display = 'none';
                if (typeof admin !== 'undefined' && admin.loadBooks) admin.loadBooks();
                loadAdminUsers();
                loadSubRequests();
            } else {
                document.getElementById('homeBtn').style.display = 'none';
            }

            if (pageId === 'browsePage') {
                if (typeof browse !== 'undefined' && browse.loadBooks) {
                    browse.loadBooks();
                }
            }
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            var mins = Math.floor(seconds / 60);
            var secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function showLoading(text) {
            var div = document.createElement('div');
            div.className = 'loading';
            div.id = 'loadingIndicator';
            div.textContent = text;
            document.body.appendChild(div);
        }

        function hideLoading() {
            var el = document.getElementById('loadingIndicator');
            if (el) el.remove();
        }

        // 用户管理
        function loadAdminUsers() {
            fetch(API_BASE + '/admin/users').then(function(r) { return r.json(); }).then(function(data) {
                var list = document.getElementById('adminUserList');
                if (!data.users || data.users.length === 0) { list.innerHTML = '<p style="color:#999;">暂无用户</p>'; return; }
                list.innerHTML = '<table style="width:100%;font-size:13px;border-collapse:collapse;">' +
                    '<tr style="background:#f5f5f5;"><th style="padding:8px;text-align:left;">手机号</th><th style="padding:8px;">角色</th><th style="padding:8px;">授权码</th><th style="padding:8px;">操作</th></tr>' +
                    data.users.map(function(u) {
                        var roleLabel = u.role === 'admin' ? '系统用户' : '普通用户';
                        var roleColor = u.role === 'admin' ? '#2d5016' : '#666';
                        return '<tr style="border-bottom:1px solid #eee;"><td style="padding:8px;">' + u.phone + '</td>' +
                            '<td style="padding:8px;text-align:center;color:' + roleColor + ';">' + roleLabel + '</td>' +
                            '<td style="padding:8px;text-align:center;"><button class="btn btn-sm" onclick="resetAuthCode(' + u.id + ')">重置</button></td>' +
                            '<td style="padding:8px;text-align:center;"><button class="btn btn-sm" onclick="toggleUserRole(' + u.id + ',\'' + u.role + '\')">' + (u.role === 'admin' ? '设为普通' : '设为系统') + '</button></td></tr>';
                    }).join('') + '</table>';
            });
        }

        function toggleUserRole(userId, currentRole) {
            var newRole = currentRole === 'admin' ? 'user' : 'admin';
            fetch(API_BASE + '/admin/users/' + userId + '/role', {
                method: 'PUT', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({role: newRole})
            }).then(function() { loadAdminUsers(); });
        }

        function resetAuthCode(userId) {
            fetch(API_BASE + '/admin/users/' + userId + '/auth-code', {method: 'POST'}).then(function(r) { return r.json(); }).then(function(d) {
                alert('新授权码: ' + d.auth_code);
            });
        }

        // 订阅审批
        function loadSubRequests() {
            fetch(API_BASE + '/admin/subscription-requests').then(function(r) { return r.json(); }).then(function(data) {
                var list = document.getElementById('adminSubRequests');
                if (!data.requests || data.requests.length === 0) { list.innerHTML = '<p style="color:#999;">暂无订阅申请</p>'; return; }
                list.innerHTML = data.requests.map(function(r) {
                    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:13px;">' +
                        '<span>用户ID:' + r.user_id + ' 申请订阅 书籍ID:' + r.book_id + '</span>' +
                        '<div><button class="btn btn-sm" style="background:#4CAF50;" onclick="approveSub(' + r.id + ')">通过</button> ' +
                        '<button class="btn btn-sm" style="background:#f44336;" onclick="rejectSub(' + r.id + ')">拒绝</button></div></div>';
                }).join('');
            });
        }

        function approveSub(reqId) {
            fetch(API_BASE + '/admin/subscription-requests/' + reqId + '/approve', {method: 'POST'}).then(function() { loadSubRequests(); });
        }

        function rejectSub(reqId) {
            fetch(API_BASE + '/admin/subscription-requests/' + reqId + '/reject', {method: 'POST'}).then(function() { loadSubRequests(); });
        }
    </script>
</body>
</html>
