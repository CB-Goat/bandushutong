<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>伴读书童 - 儿童课外阅读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'KaiTi', 'STKaiti', 'AR PL UKai CN', '楷体', cursive, serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
            overflow: hidden;
        }

        /* 导航栏 */
        .navbar {
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
            color: #e8e0c8;
            padding: 15px 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #8B7355;
        }

        .navbar h1 {
            font-size: 20px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            letter-spacing: 4px;
        }

        .navbar .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e8e0c8;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .navbar .back-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* 主容器 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 70px 15px 20px;
            height: 100vh;
            overflow: hidden;
        }

        /* 页面切换 */
        .page { display: none; overflow-y: auto; flex: 1; }
        .page.active { display: flex; flex-direction: column; }

        /* 阅读页布局 */
        #readerPage.active { height: calc(100vh - 90px); display: flex; flex-direction: column; }
        #catalogPage.active { height: calc(100vh - 60px); display: flex; flex-direction: column; }
        #catalogPage.active > .catalog-page { flex: 1; overflow-y: auto; }

        /* ===== 首页 - 书架 ===== */
        .upload-area {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px dashed #2d5016;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #4a8c2a;
            background: #f0f7ec;
        }

        .upload-area .icon { font-size: 48px; margin-bottom: 10px; }
        .upload-area p { color: #666; font-size: 14px; font-family: -apple-system, sans-serif; }

        .book-list { display: grid; gap: 15px; }

        .book-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .book-card .cover {
            width: 60px; height: 80px;
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px; flex-shrink: 0;
        }

        .book-card .info { flex: 1; }
        .book-card .title { font-size: 16px; font-weight: 600; margin-bottom: 5px; font-family: -apple-system, sans-serif; }
        .book-card .meta { font-size: 12px; color: #999; font-family: -apple-system, sans-serif; }
        .book-stats-row { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: #666; flex-wrap: wrap; }
        .book-stats-row span { background: #f0f0f0; padding: 2px 8px; border-radius: 10px; }

        /* ===== 目录页 ===== */
        .catalog-page { padding: 15px; overflow-y: auto; flex: 1; }
        .catalog-book-header { margin-bottom: 15px; }
        .catalog-book-title { font-size: 20px; font-weight: 600; color: #2d5016; }
        .catalog-book-meta { font-size: 14px; color: #888; margin-top: 4px; }
        .catalog-chapter { margin-bottom: 8px; }
        .catalog-chapter-header {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 15px; background: #f8f8f5; border-radius: 8px;
            cursor: default; font-size: 16px;
        }
        .catalog-chapter-header .ch-label { font-weight: 600; color: #2d5016; }
        .catalog-chapter-header .ch-stats { font-size: 13px; color: #999; margin-left: auto; display: flex; gap: 10px; }
        .catalog-section {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px 10px 36px; cursor: pointer;
            border-radius: 6px; transition: background 0.15s;
            font-size: 15px;
        }
        .catalog-section:hover { background: #f0f0e8; }
        .catalog-section .sec-status {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .catalog-section .sec-status.read { background: #4CAF50; }
        .catalog-section .sec-status.reading { background: #FF9800; }
        .catalog-section .sec-status.unread { background: #ddd; }
        .catalog-section .sec-title { flex: 1; color: #333; }
        .catalog-section .sec-info { font-size: 13px; color: #999; display: flex; gap: 10px; }

        /* ===== 阅读页 - 黑板风格 ===== */
        .reader-header {
            background: #3a3226;
            padding: 10px 15px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #8B7355;
            border-bottom: none;
            gap: 10px;
        }

        .reader-header .section-title {
            font-size: 16px;
            color: #e8e0c8;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .reader-header .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reader-header .mini-progress {
            width: 60px;
        }

        .reader-header .mini-progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .reader-header .mini-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6ab04c, #f0e8d0);
            width: 0%;
            transition: width 0.3s;
            border-radius: 2px;
        }

        .reader-header .play-btn-mini {
            background: linear-gradient(135deg, #4a8c2a 0%, #2d5016 100%);
            border: 2px solid #6ab04c;
            color: #f0e8d0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .reader-header .add-thought-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #FFD700;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        /* 导航栏：包含上一节、下一节、进度条、播放按钮、编辑点评按钮 */
        .section-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: #3a3226;
            padding: 10px 15px;
            border-left: 2px solid #8B7355;
            border-right: 2px solid #8B7355;
            flex-wrap: wrap;
        }

        .section-nav button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #e8e0c8;
            font-family: inherit;
            white-space: nowrap;
        }

        .section-nav button:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
        }

        .section-nav button:disabled {
            color: #665e50;
            cursor: not-allowed;
            border-color: transparent;
        }

        .section-nav .play-btn {
            background: linear-gradient(135deg, #4a8c2a 0%, #2d5016 100%);
            border: 2px solid #6ab04c;
            color: #f0e8d0;
            width: 44px;
            height: 44px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .section-nav .play-btn:hover {
            opacity: 0.9;
        }

        /* 编辑点评按钮 */
        .section-nav .edit-annotation-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #FFD700;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .section-nav .edit-annotation-btn:hover {
            background: rgba(255, 215, 0, 0.25);
        }

        .section-nav .edit-annotation-btn.active {
            background: rgba(255, 215, 0, 0.35);
            border-color: #FFD700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        /* 顶部进度条区域 */
        .section-nav .progress-area {
            flex: 1;
            max-width: 200px;
            padding: 0 10px;
        }

        .section-nav .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .section-nav .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6ab04c, #f0e8d0);
            width: 0%;
            transition: width 0.3s;
            border-radius: 2px;
        }

        .section-nav .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8a7e6a;
            margin-top: 3px;
            font-family: -apple-system, sans-serif;
        }

        /* 黑板主体 - 手机端完全贴合屏幕 */
        .chalkboard {
            background: #2a4a1a;
            border: 3px solid #8B7355;
            border-top: none;
            border-radius: 0;
            padding: 15px 15px;
            position: relative;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.02) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0,0,0,0.1) 0%, transparent 50%),
                linear-gradient(180deg, #2a4a1a 0%, #1e3a12 50%, #2a4a1a 100%);
            box-shadow:
                inset 0 0 60px rgba(0,0,0,0.3),
                0 4px 20px rgba(0,0,0,0.3);
        }

        /* 黑板边框木纹效果 */
        .chalkboard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 8px solid transparent;
            border-image: linear-gradient(135deg, #a08060, #8B7355, #6d5a3e, #8B7355, #a08060) 1;
            pointer-events: none;
            border-radius: 0;
        }

        /* 粉笔文字容器 - 自适应高度，占满剩余空间 */
        .chalkboard .chalk-text {
            position: relative;
            z-index: 1;
            font-size: 22px;
            line-height: 2.2;
            color: #f0e8d0;
            text-shadow:
                0 0 5px rgba(240,232,208,0.3),
                1px 1px 0 rgba(0,0,0,0.2);
            letter-spacing: 1px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        /* 粉笔字效果 - 每个字符 */
        .chalkboard .chalk-char {
            display: inline;
            opacity: 0;
            transition: opacity 0.15s ease;
            cursor: default;
        }

        .chalkboard .chalk-char.visible {
            opacity: 1;
            text-shadow:
                0 0 4px rgba(240,232,208,0.4),
                0 0 8px rgba(240,232,208,0.1),
                1px 1px 0 rgba(0,0,0,0.15);
        }

        /* 标点符号稍小 */
        .chalkboard .chalk-char.punct {
            font-size: 18px;
        }

        /* 段落换行 */
        .chalkboard .chalk-linebreak {
            display: block;
            height: 10px;
        }

        /* 点评编辑模式下的文字选中效果 */
        .chalkboard .chalk-char.selectable {
            cursor: pointer;
        }

        .chalkboard .chalk-char.selectable:hover {
            background: rgba(255, 215, 0, 0.2);
            border-radius: 2px;
        }

        .chalkboard .chalk-char.selected {
            background: rgba(255, 215, 0, 0.35);
            border-radius: 2px;
        }

        /* 点评标记样式 - 波浪下划线 + 金色加粗 */
        .chalkboard .chalk-char.annotated {
            color: #FFD700 !important;
            font-weight: bold;
            text-decoration: underline wavy #FFD700;
            text-underline-offset: 4px;
        }

        /* 点评序号上标 */
        .annotation-superscript {
            font-size: 12px;
            color: #FFD700;
            vertical-align: super;
            font-weight: bold;
            margin-left: 1px;
            text-shadow: 0 0 4px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        /* 赏析点评区域 - 填充剩余空间 */
        .chalkboard .analysis-area {
            position: relative;
            z-index: 1;
            border-top: 2px dashed rgba(240,232,208,0.2);
            padding-top: 12px;
            margin-top: 10px;
            height: 120px;
            min-height: 120px;
            max-height: 120px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .chalkboard .analysis-area .label {
            font-size: 14px;
            color: rgba(240,232,208,0.5);
            margin-bottom: 8px;
        }

        .chalkboard .analysis-area .content {
            font-size: 16px;
            line-height: 1.8;
            color: rgba(240,232,208,0.8);
        }

        /* 点评原文引用样式 */
        .chalkboard .analysis-area .content .original-text {
            color: #FFD700;
            font-style: italic;
            margin-bottom: 10px;
        }

        /* 点评内容样式 */
        .chalkboard .analysis-area .content .comment-text {
            color: rgba(240,232,208,0.9);
        }

        /* 赏析点评标签区域 */
        .chalkboard .analysis-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .chalkboard .analysis-tabs .tab {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(240,232,208,0.1);
            color: rgba(240,232,208,0.5);
            border: 1px solid rgba(240,232,208,0.15);
        }

        .chalkboard .analysis-tabs .tab:hover {
            background: rgba(240,232,208,0.15);
        }

        .chalkboard .analysis-tabs .tab.active {
            background: rgba(255, 215, 0, 0.25);
            color: #FFD700;
            border-color: rgba(255, 215, 0, 0.4);
            font-weight: bold;
        }

        .chalkboard .analysis-tabs .tab.summary-tab {
            background: rgba(100, 200, 100, 0.2);
            color: #90EE90;
            border-color: rgba(100, 200, 100, 0.3);
        }

        .chalkboard .analysis-tabs .tab.summary-tab.active {
            background: rgba(100, 200, 100, 0.35);
            color: #90EE90;
            border-color: rgba(100, 200, 100, 0.5);
        }

        /* 点评内容显示区域 */
        .chalkboard .analysis-area .annotation-display {
            display: none;
            padding: 10px 15px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            margin-top: 8px;
        }

        .chalkboard .analysis-area .annotation-display.active {
            display: block;
        }

        .chalkboard .analysis-area .annotation-display .annotation-index {
            font-size: 18px;
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .chalkboard .analysis-area .annotation-display .annotation-original {
            font-size: 14px;
            color: rgba(240,232,208,0.6);
            margin-bottom: 6px;
            font-style: italic;
        }

        .chalkboard .analysis-area .annotation-display .annotation-comment {
            font-size: 16px;
            line-height: 1.8;
            color: #f0e8d0;
        }

        .chalkboard .analysis-area .annotation-display .annotation-comment .comment-char {
            display: inline;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .chalkboard .analysis-area .annotation-display .annotation-comment .comment-char.visible {
            opacity: 1;
        }

        /* 粉笔灰效果 */
        .chalkboard::after {
            content: '';
            position: absolute;
            bottom: 10px;
            right: 20px;
            width: 60px;
            height: 3px;
            background: rgba(240,232,208,0.08);
            border-radius: 2px;
            transform: rotate(-5deg);
            pointer-events: none;
        }

        /* 等待提示 */
        .chalkboard .wait-hint {
            color: rgba(240,232,208,0.4);
            font-size: 16px;
            text-align: center;
            padding-top: 80px;
            letter-spacing: 2px;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-family: -apple-system, sans-serif;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid #2d5016;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* 点评输入弹窗 */
        .annotation-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .annotation-modal-overlay.active {
            display: flex;
        }

        .annotation-modal {
            background: #3a3226;
            border: 2px solid #8B7355;
            border-radius: 12px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .annotation-modal .modal-title {
            font-size: 18px;
            color: #e8e0c8;
            margin-bottom: 15px;
            text-align: center;
        }

        .annotation-modal .selected-text {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-size: 16px;
            color: #FFD700;
            line-height: 1.6;
            max-height: 120px;
            overflow-y: auto;
        }

        .annotation-modal textarea {
            width: 100%;
            height: 100px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            color: #f0e8d0;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }

        .annotation-modal textarea:focus {
            border-color: #FFD700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
        }

        .annotation-modal .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .annotation-modal .modal-buttons button {
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }

        .annotation-modal .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: #e8e0c8;
        }

        .annotation-modal .btn-cancel:hover {
            background: rgba(255,255,255,0.2);
        }

        .annotation-modal .btn-save {
            background: linear-gradient(135deg, #4a8c2a 0%, #2d5016 100%);
            border-color: #6ab04c;
            color: #f0e8d0;
        }

        .annotation-modal .btn-save:hover {
            opacity: 0.9;
        }

        /* 响应式 - 手机端优化 */
        @media (max-width: 480px) {
            .container { padding: 70px 0 0; }
            /* 黑板完全贴合屏幕两侧 */
            .chalkboard {
                padding: 10px 8px;
                border-left: none;
                border-right: none;
                border-radius: 0;
            }
            .chalkboard::before {
                border-left: none;
                border-right: none;
            }
            .chalkboard .chalk-text {
                font-size: 20px;
                line-height: 2;
                padding: 0 4px;
            }
            /* 点评区域固定高度 */
            .chalkboard .analysis-area {
                height: 100px;
                min-height: 100px;
                max-height: 100px;
                padding-top: 8px;
                margin-top: 8px;
            }
            .section-nav { gap: 8px; }
            .section-nav button { padding: 6px 10px; font-size: 13px; }
            .section-nav .progress-area { max-width: 140px; }
            .section-nav .edit-annotation-btn { padding: 6px 10px; font-size: 12px; }
        }
        /* ===== 管理页面样式 ===== */
        .admin-page { padding: 15px; overflow-y: auto; max-height: calc(100vh - 60px); }
        .admin-page h2 { font-size: 20px; margin-bottom: 15px; color: #2d5016; border-bottom: 2px solid #2d5016; padding-bottom: 8px; }
