<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>阅读 - 悦读小将</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'KaiTi', 'STKaiti', '楷体', cursive, serif;
            background: #2a4a1a;
            color: #f0e8d0;
            line-height: 1.6;
            overflow: hidden;
        }
        .navbar {
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
            color: #e8e0c8;
            padding: 10px 20px;
            height: 52px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #8B7355;
        }
        .navbar h1 {
            font-size: 16px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .navbar .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e8e0c8;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            margin-right: 10px;
        }
        .reader-container {
            margin-top: 52px;
            height: calc(100vh - 52px);
            display: flex;
            flex-direction: column;
        }
        .controls {
            background: #3a3226;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #8B7355;
        }
        .play-btn {
            background: linear-gradient(135deg, #4a8c2a 0%, #2d5016 100%);
            border: 2px solid #6ab04c;
            color: #f0e8d0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .play-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .progress-area {
            flex: 1;
            padding: 0 10px;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6ab04c, #f0e8d0);
            width: 0%;
            transition: width 0.3s;
        }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8a7e6a;
            margin-top: 3px;
            font-family: -apple-system, sans-serif;
        }
        .chalkboard {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.02) 0%, transparent 50%),
                linear-gradient(180deg, #2a4a1a 0%, #1e3a12 50%, #2a4a1a 100%);
        }
        .chalk-text {
            font-size: 20px;
            line-height: 2;
            color: #f0e8d0;
            text-shadow: 0 0 5px rgba(240,232,208,0.3), 1px 1px 0 rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
        .chalk-char {
            display: inline;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .chalk-char.visible {
            opacity: 1;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(240,232,208,0.5);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1 id="sectionTitle">加载中...</h1>
    </div>

    <div class="reader-container">
        <div class="controls">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <div class="progress-area">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>
        </div>
        <div class="chalkboard">
            <div class="chalk-text" id="chalkText">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        var state = {
            currentSection: null,
            isPlaying: false,
            playbackPlan: null,
            audioIndex: 0,
            charTimeline: [],
            totalDuration: 0,
            currentTime: 0
        };
        var audio = new Audio();

        function getUrlParam(name) {
            var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        function goBack() {
            var bookId = getUrlParam('book_id');
            if (bookId) {
                location.href = 'catalog.html?book_id=' + bookId;
            } else {
                location.href = 'bookshelf.html';
            }
        }

        async function loadSection() {
            var sectionId = getUrlParam('section_id');
            if (!sectionId) {
                alert('缺少章节ID');
                goBack();
                return;
            }

            var sectionData = localStorage.getItem('currentSection');
            if (sectionData) {
                try {
                    state.currentSection = JSON.parse(sectionData);
                    document.getElementById('sectionTitle').textContent = state.currentSection.title || '阅读';
                    renderText(state.currentSection.content || '');
                    loadPlaybackPlan(sectionId);
                    return;
                } catch (e) {
                    console.error('解析章节数据失败:', e);
                }
            }

            document.getElementById('chalkText').innerHTML = '<div class="loading">暂无章节数据</div>';
        }

        async function loadPlaybackPlan(sectionId) {
            try {
                var response = await fetch(API_BASE + '/sections/' + sectionId + '/playback-plan');
                var data = await response.json();

                if (data.playlist && data.playlist.length > 0) {
                    state.playbackPlan = data.playlist;
                    state.totalDuration = data.total_duration || 0;
                    document.getElementById('totalTime').textContent = formatTime(state.totalDuration);

                    for (var i = 0; i < data.playlist.length; i++) {
                        var item = data.playlist[i];
                        if (item.type === 'text_segment' && item.char_timeline) {
                            var timeline = item.char_timeline;
                            if (typeof timeline === 'string') {
                                try { timeline = JSON.parse(timeline); } catch (e) { timeline = []; }
                            }
                            state.charTimeline = state.charTimeline.concat(timeline);
                        }
                    }
                }
            } catch (e) {
                console.error('加载播放计划失败:', e);
            }
        }

        function renderText(text) {
            var container = document.getElementById('chalkText');
            var html = '';
            for (var i = 0; i < text.length; i++) {
                var char = text[i];
                if (char === '\n') {
                    html += '<br>';
                } else {
                    html += '<span class="chalk-char" data-index="' + i + '">' + char + '</span>';
                }
            }
            container.innerHTML = html;
        }

        function togglePlay() {
            if (!state.playbackPlan || state.playbackPlan.length === 0) {
                alert('暂无音频');
                return;
            }

            if (state.isPlaying) {
                pause();
            } else {
                play();
            }
        }

        function play() {
            state.isPlaying = true;
            document.getElementById('playBtn').textContent = '⏸';

            if (audio.paused && audio.src) {
                audio.play();
            } else {
                playNextAudio();
            }
        }

        function pause() {
            state.isPlaying = false;
            document.getElementById('playBtn').textContent = '▶';
            audio.pause();
        }

        function playNextAudio() {
            if (state.audioIndex >= state.playbackPlan.length) {
                state.audioIndex = 0;
                pause();
                return;
            }

            var item = state.playbackPlan[state.audioIndex];
            if (item.type === 'text_segment' && item.audio_path) {
                audio.src = item.audio_path;
                audio.play();
            } else {
                state.audioIndex++;
                playNextAudio();
            }
        }

        audio.onended = function() {
            state.audioIndex++;
            if (state.isPlaying) {
                playNextAudio();
            }
        };

        audio.ontimeupdate = function() {
            state.currentTime = audio.currentTime;
            var progress = (audio.currentTime / state.totalDuration) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);

            updateCharDisplay(audio.currentTime);
        };

        function updateCharDisplay(currentTime) {
            if (state.charTimeline.length === 0) return;

            var chars = document.querySelectorAll('.chalk-char');
            for (var i = 0; i < state.charTimeline.length; i++) {
                var point = state.charTimeline[i];
                if (currentTime >= point.time && chars[point.char_index]) {
                    chars[point.char_index].classList.add('visible');
                }
            }
        }

        function formatTime(seconds) {
            var mins = Math.floor(seconds / 60);
            var secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        loadSection();
    </script>
</body>
</html>
