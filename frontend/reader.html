<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>阅读 - 悦读小将</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'KaiTi', 'STKaiti', '楷体', cursive, serif;
            background: #2a4a1a;
            color: #f0e8d0;
            line-height: 1.6;
            overflow: hidden;
        }
        .navbar {
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
            color: #e8e0c8;
            padding: 10px 20px;
            height: 52px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #8B7355;
        }
        .navbar h1 {
            font-size: 16px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .navbar .back-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e8e0c8;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            margin-right: 10px;
        }
        .reader-container {
            margin-top: 52px;
            height: calc(100vh - 52px);
            display: flex;
            flex-direction: column;
        }
        .controls {
            background: #3a3226;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #8B7355;
        }
        .play-btn {
            background: linear-gradient(135deg, #4a8c2a 0%, #2d5016 100%);
            border: 2px solid #6ab04c;
            color: #f0e8d0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .progress-area {
            flex: 1;
            padding: 0 10px;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6ab04c, #f0e8d0);
            width: 0%;
            transition: width 0.3s;
        }
        .chalkboard {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.02) 0%, transparent 50%),
                linear-gradient(180deg, #2a4a1a 0%, #1e3a12 50%, #2a4a1a 100%);
        }
        .chalk-text {
            font-size: 20px;
            line-height: 2;
            color: #f0e8d0;
            text-shadow: 0 0 5px rgba(240,232,208,0.3), 1px 1px 0 rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(240,232,208,0.5);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1 id="sectionTitle">加载中...</h1>
    </div>

    <div class="reader-container">
        <div class="controls">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <div class="progress-area">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        <div class="chalkboard">
            <div class="chalk-text" id="chalkText">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        var state = {
            currentBook: null,
            currentSection: null,
            isPlaying: false
        };

        // 获取URL参数
        function getUrlParam(name) {
            var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)');
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return decodeURIComponent(r[2]);
            return null;
        }

        // 返回目录
        function goBack() {
            var bookId = getUrlParam('book_id');
            if (bookId) {
                location.href = 'catalog.html?book_id=' + bookId;
            } else {
                location.href = 'bookshelf.html';
            }
        }

        // 加载章节
        async function loadSection() {
            var sectionId = getUrlParam('section_id');
            if (!sectionId) {
                alert('缺少章节ID');
                goBack();
                return;
            }

            try {
                var response = await fetch(API_BASE + '/sections/' + sectionId);
                var data = await response.json();

                if (!response.ok) {
                    alert('加载失败: ' + data.error);
                    goBack();
                    return;
                }

                state.currentSection = data.section;
                document.getElementById('sectionTitle').textContent = data.section.title || '阅读';
                document.getElementById('chalkText').textContent = data.section.content || '暂无内容';

            } catch (e) {
                alert('网络错误: ' + e.message);
                goBack();
            }
        }

        // 播放/暂停
        function togglePlay() {
            state.isPlaying = !state.isPlaying;
            document.getElementById('playBtn').textContent = state.isPlaying ? '⏸' : '▶';
            // TODO: 实现播放逻辑
        }

        // 初始化
        loadSection();
    </script>
</body>
</html>
