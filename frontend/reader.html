                };
                this._annotationAudio.onended = function() {
                    self._annotationAudio.onended = null;
                    self._insertPointStep = 2;
                    self._executeInsertPointStep();
                };
                this._safeSetTimeout(function() { if (self._insertPointStep === 1 && !self._isFinishing) self._finishInsertPoint(); }, 5000);
            },

            _playQuoteAudio: function() {
                var self = this;
                var seg = this._currentInsertPoint;
                console.log('[点评] 步骤2：播放引用音频, quote_audio_path=' + seg.quote_audio_path);

                if (!seg.quote_audio_path) {
                    console.log('[点评] 引用无独立音频，跳过');
                    self._insertPointStep = 3;
                    self._executeInsertPointStep();
                    return;
                }

                var quoteStartChar = seg.quote_start_char || 0;
                var quoteEndChar = seg.quote_end_char || 0;

                if (typeof reader !== 'undefined' && reader._clearQuoteHighlight) {
                    reader._clearQuoteHighlight(quoteStartChar, quoteEndChar);
                }

                this._annotationAudio.src = seg.quote_audio_path;
                this._annotationAudio.load();

                var quoteAudioDuration = seg.quote_audio_duration || 0;
                var charCount = quoteEndChar - quoteStartChar;

                this._annotationAudio.oncanplay = function() {
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.play().then(function() { self.isPlaying = true; state.isPlaying = true; }).catch(function() { self._finishInsertPoint(); });
                };

                this._annotationAudio.onended = function() {
                    self._annotationAudio.onended = null;
                    self._annotationAudio.ontimeupdate = null;
                    if (typeof reader !== 'undefined' && reader._highlightCharsUpTo) {
                        reader._highlightCharsUpTo(quoteStartChar, quoteEndChar);
                    }
                    console.log('[点评] 引用音频播放结束，进入步骤3');
                    self._insertPointStep = 3;
                    self._executeInsertPointStep();
                };

                var _lastQuoteTimeUpdate = 0;
                this._annotationAudio.ontimeupdate = function() {
                    var now = Date.now();
                    if (now - _lastQuoteTimeUpdate < 200) return;
                    _lastQuoteTimeUpdate = now;
                    if (quoteAudioDuration > 0 && charCount > 0) {
                        var currentTime = self._annotationAudio.currentTime;
                        var progress = currentTime / quoteAudioDuration;
                        var currentCharIdx = Math.min(Math.floor(progress * charCount), charCount);
                        if (typeof reader !== 'undefined' && reader._highlightCharsUpTo) {
                            reader._highlightCharsUpTo(quoteStartChar, quoteStartChar + currentCharIdx);
                        }
                    }
                };

                this._safeSetTimeout(function() { if (self._insertPointStep === 2 && !self._isFinishing) self._finishInsertPoint(); }, 30000);
            },

            _playCommentAudio: function() {
                var self = this;
                var seg = this._currentInsertPoint;
                console.log('[点评] 步骤4：播放评论音频, audio_path=' + seg.audio_path);

                if (this._pendingAnnotation && typeof analysisManager !== 'undefined') {
                    analysisManager.addAnnotationTab(this._pendingAnnotation);
                    this._pendingAnnotation = null;
                }

                if (!seg.audio_path) {
                    console.log('[点评] 评论无音频，跳过');
                    self._insertPointStep = 5;
                    self._executeInsertPointStep();
                    return;
                }

                var analysisContent = document.getElementById('analysisContent');
                var commentChars = analysisContent ? analysisContent.querySelectorAll('.comment-char') : [];
                console.log('[点评] 找到 ' + commentChars.length + ' 个评论字符元素');

                    commentChars[i].classList.remove('visible');

                var annotationDisplay = document.getElementById('annotationDisplay');
                if (annotationDisplay) { annotationDisplay.classList.add('active'); annotationDisplay.scrollTop = 0; }
                if (analysisContent) analysisContent.scrollTop = 0;

                var commentText = seg.comment || '';
                var audioDuration = seg.audio_duration || 1;
                var charCount = commentChars.length;

                this._annotationAudio.src = seg.audio_path;
                this._annotationAudio.load();

                this._annotationAudio.oncanplay = function() {
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.play().then(function() { self.isPlaying = true; state.isPlaying = true; }).catch(function() { self._finishInsertPoint(); });
                };

                this._annotationAudio.onended = function() {
                    self._annotationAudio.onended = null;
                    self._annotationAudio.ontimeupdate = null;
                    for (var i = 0; i < commentChars.length; i++) commentChars[i].classList.add('visible');
                    if (typeof analysisManager !== 'undefined') {
                        var tabId = 'annotation_' + seg.annotation_id;
                        var tab = analysisManager.tabs.find(function(t) { return t.id === tabId; });
                        if (tab) { tab._played = true; tab._commentText = commentText; }
                    }
                    self._insertPointStep = 5;
                    self._executeInsertPointStep();
                };

                var lastCharIdx = 0;
                var _lastCommentTimeUpdate = 0;
                this._annotationAudio.ontimeupdate = function() {
                    var now = Date.now();
                    if (now - _lastCommentTimeUpdate < 200) return;
                    _lastCommentTimeUpdate = now;
                    var currentAnalysisContent = document.getElementById('analysisContent');
                    if (audioDuration > 0 && charCount > 0 && currentAnalysisContent) {
                        var currentTime = self._annotationAudio.currentTime;
                        var progress = currentTime / audioDuration;
                        var currentCharIdx = Math.min(Math.floor(progress * charCount) + 3, charCount);
                        for (var i = lastCharIdx; i < currentCharIdx; i++) {
                            if (commentChars[i]) commentChars[i].classList.add('visible');
                        }
                        lastCharIdx = currentCharIdx;
                        if (commentChars[currentCharIdx - 1]) {
                            var charEl = commentChars[currentCharIdx - 1];
                            var containerRect = currentAnalysisContent.getBoundingClientRect();
                            var charRect = charEl.getBoundingClientRect();
                            if (charRect.bottom > containerRect.bottom) {
                                currentAnalysisContent.scrollTop += (charRect.bottom - containerRect.bottom);
                            }
                        }
                    }
                };

                this._safeSetTimeout(function() { if (self._insertPointStep === 4 && !self._isFinishing) self._finishInsertPoint(); }, 60000);
            },

            _playClosingAudio: function() {
                var self = this;
                if (this._isLastAnnotation()) {
                    console.log('[点评] 步骤6：是最后一个点评，跳过结束语');
                    this._finishInsertPoint();
                    return;
                }
                console.log('[点评] 步骤6：播放结束语');
                var voiceType = (state.currentBook && state.currentBook.voice_type) || 'male';
                var suffix = voiceType === 'female' ? '_male' : '_female';
                this._annotationAudio.src = '/api/audio/annotation_closing' + suffix + '.mp3';
                this._annotationAudio.load();
                this._annotationAudio.oncanplay = function() {
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.play().then(function() { self.isPlaying = true; state.isPlaying = true; }).catch(function() { self._finishInsertPoint(); });
                };
                this._annotationAudio.onended = function() { self._annotationAudio.onended = null; self._finishInsertPoint(); };
            },

            _playSummaryAudio: function(seg) {
                var self = this;
                console.log('[小结] 播放小结音频（5步骤流程）');
                if (this._isFinishing) {
                    console.log('[小结] 已在完成中，跳过重复调用');
                    return;
                }
                if (typeof analysisManager !== 'undefined' && analysisManager.stopRotation) {
                    analysisManager.stopRotation();
                    console.log('[小结] 暂停轮询');
                }
                this._currentSummarySeg = seg;
                this._summaryStep = 0;
                this._executeSummaryStep();
            },

            _currentSummarySeg: null,
            _summaryStep: 0,

            _executeSummaryStep: function() {
                var self = this;
                var seg = this._currentSummarySeg;
                if (!seg) {
                    console.log('[小结] 无小结数据，结束');
                    this._finishSummaryPlayback();
                    return;
                }
                this._summaryStep++;
                console.log('[小结] 步骤 ' + this._summaryStep);
                switch (this._summaryStep) {
                    case 1: this._playSummaryOpening(); break;
                    case 2: this._playSummaryCountdown(); break;
                    case 3: this._playSummaryContent(); break;
                    case 4: this._playSummaryPause(); break;
                    case 5: this._playSummaryClosing(); break;
                    default: this._finishSummaryPlayback(); break;
                }
            },

            _playSummaryOpening: function() {
                var self = this;
                var stepCompleted = false;
                document.getElementById('annotationDisplay').classList.remove('active');
                var voiceType = (state.currentBook && state.currentBook.voice_type) || 'male';
                var suffix = voiceType === 'female' ? '_male' : '_female';
                this._annotationAudio.src = '/api/audio/summary_opening' + suffix + '.mp3';
                this._annotationAudio.load();
                var completeStep = function() {
                    if (stepCompleted) return;
                    stepCompleted = true;
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.onerror = null;
                    self._annotationAudio.onended = null;
                    self._executeSummaryStep();
                };
                var canPlayHandler = function() {
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.play().then(function() {
                        self.isPlaying = true; state.isPlaying = true;
                    }).catch(function(e) {
                        console.log('[小结] 开场播放失败:', e);
                        completeStep();
                    });
                };
                this._annotationAudio.oncanplay = canPlayHandler;
                this._annotationAudio.onended = function() { completeStep(); };
                this._annotationAudio.onerror = function(e) {
                    console.log('[小结] 开场音频加载失败:', e);
                    completeStep();
                };
                this._safeSetTimeout(function() {
                    if (!stepCompleted) { console.log('[小结] 开场超时(3秒)，跳过'); completeStep(); }
                }, 3000);
            },

            _playSummaryCountdown: function() {
                var self = this;
                var countdownOverlay = document.getElementById('summaryCountdownOverlay');
                var countdownNumber = document.getElementById('summaryCountdownNumber');
                if (!countdownOverlay || !countdownNumber) {
                    console.log('[小结] 倒计时元素不存在，跳过');
                    this._executeSummaryStep();
                    return;
                }
                document.getElementById('annotationDisplay').classList.remove('active');
                countdownOverlay.classList.add('active');
                var count = 5;
                countdownNumber.textContent = count;
                countdownNumber.style.animation = 'none';
                countdownNumber.offsetHeight;
                countdownNumber.style.animation = 'countdownPulse 1s ease-in-out';
                var countdownInterval = setInterval(function() {
                    count--;
                    if (count > 0) {
                        countdownNumber.textContent = count;
                        countdownNumber.style.animation = 'none';
                        countdownNumber.offsetHeight;
                        countdownNumber.style.animation = 'countdownPulse 1s ease-in-out';
                    } else {
                        clearInterval(countdownInterval);
                        countdownOverlay.classList.remove('active');
                        self._executeSummaryStep();
                    }
                }, 1000);
                this._safeSetTimeout(function() { clearInterval(countdownInterval); }, 6000);
            },

            _playSummaryContent: function() {
                var self = this;
                var seg = this._currentSummarySeg;
                if (!seg.audio_path) {
                    console.log('[小结] 无音频路径，跳过内容播放');
                    this._executeSummaryStep();
                    return;
                }
                var commentText = seg.comment || '';
                var audioDuration = seg.audio_duration || 1;
                var commentChars = [];
                if (typeof analysisManager !== 'undefined') {
                    analysisManager.addSummaryTab('');
                }
                var analysisContent = document.getElementById('analysisContent');
                if (analysisContent) {
                    analysisContent.innerHTML = '<div class="comment-text"></div>';
                    var commentContainer = analysisContent.querySelector('.comment-text');
                    var chars = commentText.split('');
                    for (var i = 0; i < chars.length; i++) {
                        var span = document.createElement('span');
                        span.className = 'comment-char';
                        span.textContent = chars[i];
                        commentContainer.appendChild(span);
                        commentChars.push(span);
                    }
                }
                var annotationDisplay = document.getElementById('annotationDisplay');
                if (annotationDisplay) { annotationDisplay.classList.remove('active'); annotationDisplay.scrollTop = 0; }
                if (analysisContent) { analysisContent.scrollTop = 0; }
                var charCount = commentChars.length;
                this._annotationAudio.src = seg.audio_path;
                this._annotationAudio.load();
                var stepCompleted = false;
                var completeStep = function() {
                    if (stepCompleted) return;
                    stepCompleted = true;
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.onerror = null;
                    self._annotationAudio.onended = null;
                    self._annotationAudio.ontimeupdate = null;
                    for (var i = 0; i < commentChars.length; i++) { commentChars[i].classList.add('visible'); }
                    var ad = document.getElementById('annotationDisplay');
                    if (ad) ad.classList.remove('active');
                    if (typeof analysisManager !== 'undefined') {
                        var tab = analysisManager.tabs.find(function(t) { return t.id === 'summary'; });
                        if (tab) {
                            tab._played = true;
                            tab._commentText = commentText;
                            tab.content = commentText;
                            var ac = document.getElementById('analysisContent');
                            if (ac) { ac.innerHTML = '<div class="comment-text">' + commentText + '</div>'; }
                        }
                    }
                    self._executeSummaryStep();
                };
                var canPlayHandler = function() {
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.play().then(function() {
                        self.isPlaying = true; state.isPlaying = true;
                    }).catch(function(e) {
                        console.log('[小结] 内容播放失败:', e);
                        completeStep();
                    });
                };
                this._annotationAudio.oncanplay = canPlayHandler;
                this._annotationAudio.onended = function() { completeStep(); };
                this._annotationAudio.onerror = function(e) {
                    console.log('[小结] 内容音频加载失败:', e);
                    completeStep();
                };
                var lastCharIdx = 0;
                var _lastSummaryTimeUpdate = 0;
                var timeUpdateHandler = function() {
                    var now = Date.now();
                    if (now - _lastSummaryTimeUpdate < 200) return;
                    _lastSummaryTimeUpdate = now;
                    if (audioDuration > 0 && charCount > 0) {
                        var currentTime = self._annotationAudio.currentTime;
                        var progress = currentTime / audioDuration;
                        var currentCharIdx = Math.min(Math.floor(progress * charCount) + 3, charCount);
                        for (var i = lastCharIdx; i < currentCharIdx; i++) {
                            if (commentChars[i]) commentChars[i].classList.add('visible');
                        }
                        lastCharIdx = currentCharIdx;
                        var ac = document.getElementById('analysisContent');
                        if (ac && commentChars[currentCharIdx - 1]) {
                            var charEl = commentChars[currentCharIdx - 1];
                            var containerRect = ac.getBoundingClientRect();
                            var charRect = charEl.getBoundingClientRect();
                            if (charRect.bottom > containerRect.bottom) {
                                ac.scrollTop += (charRect.bottom - containerRect.bottom);
                            }
                        }
                    }
                };
                this._annotationAudio.ontimeupdate = timeUpdateHandler;
                this._safeSetTimeout(function() {
                    if (!stepCompleted) { console.log('[小结] 内容播放超时，跳过'); completeStep(); }
                }, Math.max(audioDuration * 1000 + 5000, 60000));
            },

            _playSummaryPause: function() {
                var self = this;
                this._safeSetTimeout(function() { self._executeSummaryStep(); }, 2000);
            },

            _playSummaryClosing: function() {
                var self = this;
                var stepCompleted = false;
                var audioStarted = false;
                document.getElementById('annotationDisplay').classList.remove('active');
                var voiceType = (state.currentBook && state.currentBook.voice_type) || 'male';
                var suffix = voiceType === 'female' ? '_male' : '_female';
                this._annotationAudio.src = '/api/audio/summary_closing' + suffix + '.mp3';
                this._annotationAudio.load();
                var completeStep = function() {
                    if (stepCompleted) return;
                    stepCompleted = true;
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.onerror = null;
                    self._annotationAudio.onended = null;
                    self._annotationAudio.onplaying = null;
                    self._finishSummaryPlayback();
                };
                var playingHandler = function() {
                    audioStarted = true;
                    self._annotationAudio.onplaying = null;
                };
                var canPlayHandler = function() {
                    self._annotationAudio.oncanplay = null;
                    self._annotationAudio.play().then(function() {
                        self.isPlaying = true; state.isPlaying = true;
                    }).catch(function(e) {
                        console.log('[小结] 结束语播放失败:', e);
                        completeStep();
                    });
                };
                this._annotationAudio.oncanplay = canPlayHandler;
                this._annotationAudio.onended = function() { completeStep(); };
                this._annotationAudio.onerror = function(e) {
                    console.log('[小结] 结束语音频加载失败:', e);
                    completeStep();
                };
                this._annotationAudio.onplaying = playingHandler;
                this._safeSetTimeout(function() {
                    if (!stepCompleted && !audioStarted) { console.log('[小结] 结束语加载超时(5秒)，跳过'); completeStep(); }
                }, 5000);
            },

            _finishSummaryPlayback: function() {
                if (this._isFinishing) return;
                this._isFinishing = true;
                this._currentSummarySeg = null;
                this._summaryStep = 0;
                var countdownOverlay = document.getElementById('summaryCountdownOverlay');
                if (countdownOverlay) countdownOverlay.classList.remove('active');
                var annotationDisplay = document.getElementById('annotationDisplay');
                if (annotationDisplay) annotationDisplay.classList.remove('active');
                this._clearAllTimers();
                if (this._commentTextAnimationTimer) { clearInterval(this._commentTextAnimationTimer); this._commentTextAnimationTimer = null; }
                if (this._annotationAudio) { this._annotationAudio.pause(); this._annotationAudio.src = ''; this._annotationAudio = new Audio(); }
                this._isFinishing = false;
                this._finishInsertPoint();
            },

            _isLastAnnotation: function() {
                var nextIdx = this._playlistIndex + 1;
                if (nextIdx >= this.audioSegments.length) return true;
                var nextSeg = this.audioSegments[nextIdx];
                if (nextSeg.type === 'insert_point' && nextSeg.point_type === 'summary') return true;
                return false;
            },

            _finishInsertPoint: function() {
                var self = this;
                if (this._isFinishing) return;

                if (this._insertPointStep === 2 && this._annotationAudio && !this._annotationAudio.ended && this._annotationAudio.currentTime < (this._annotationAudio.duration || Infinity)) {
                    this._isFinishing = false;
                    return;
                }

                this._isFinishing = true;

                var seg = this._currentInsertPoint;
                if (seg && seg.point_type === 'annotation' && seg.annotation_id) {
                    var annotation = null;
                    if (state.currentAnnotations) {
                        for (var i = 0; i < state.currentAnnotations.length; i++) {
                            if (state.currentAnnotations[i].id === seg.annotation_id) { annotation = state.currentAnnotations[i]; break; }
                        }
                    }
                    if (!annotation && seg.quote_end_char) {
                        annotation = { id: seg.annotation_id, annotation_index: seg.annotation_index || 1, end_char: seg.quote_end_char, comment: seg.comment || '' };
                    }
                    if (annotation && seg.annotation_index) annotation.annotation_index = seg.annotation_index;
                    if (annotation && typeof reader !== 'undefined' && reader._showAnnotationMarker) {
                        console.log('[点评] 显示点评序号', annotation.annotation_index);
                        reader._showAnnotationMarker(annotation);
                    }
                }

                this._clearAllTimers();
                if (this._commentTextAnimationTimer) { clearInterval(this._commentTextAnimationTimer); this._commentTextAnimationTimer = null; }

                var annotationDisplay = document.getElementById('annotationDisplay');
                if (annotationDisplay) annotationDisplay.classList.remove('active');

                if (typeof analysisManager !== 'undefined' && analysisManager.resumeRotation) analysisManager.resumeRotation();

                if (this._annotationAudio) { this._annotationAudio.pause(); this._annotationAudio.src = ''; this._annotationAudio = new Audio(); }

                this._insertPointStep = 0;
                this._currentInsertPoint = null;
                state.isPlayingAnnotation = false;
                state.isPlayingSummary = false;
                document.getElementById('analysisTabs').classList.remove('disabled');

                var playBtn = document.getElementById('playBtn');
                if (playBtn) { playBtn.disabled = false; playBtn.style.opacity = '1'; playBtn.title = ''; }

                this._onSegmentEnd();
            },

            _clearAllTimers: function() {
                if (this._allTimers && this._allTimers.length > 0) {
                    this._allTimers.forEach(function(timerId) { clearTimeout(timerId); });
                    this._allTimers = [];
                }
            },

            _safeSetTimeout: function(callback, delay) {
                var self = this;
                var timerId = setTimeout(function() {
                    var idx = self._allTimers.indexOf(timerId);
                    if (idx >= 0) self._allTimers.splice(idx, 1);
                    callback();
                }, delay);
                this._allTimers.push(timerId);
                return timerId;
            },

            _onSegmentEnd: function() {
                console.log('[播放] 段结束: 段' + this._playlistIndex);
                var section = state.currentSections[state.currentSectionIndex];
                if (section) reader.saveProgress(reader._currentPosition || 0);
                this._playNextSegment();
            },

            _onAllSegmentsEnd: function() {
                console.log('[播放] 全部段播放结束');
                this.isPlaying = false; state.isPlaying = false;
                document.getElementById('playBtn').textContent = '\u25B6';

                document.getElementById('progressFill').style.width = '100%';

                if (reader.revealAll) reader.revealAll();
                if (reader.markSectionRead) reader.markSectionRead();
                var section = state.currentSections[state.currentSectionIndex];
                if (section) {
                    reader.saveProgress(reader._totalChars || 0);
                    if (state.catalogStatusMap) state.catalogStatusMap[section.id] = 'read';
                }
                thoughtEditor.updateAllLanternsState();
                if (section && section.summary) {
                    analysisManager.addSummaryTab(section.summary);
                    analysisManager.resumeRotation();
                }
            },

            _getCharIndexFromTime: function(time) {
                if (!this.charTimeline || this.charTimeline.length === 0) return 0;
                var charIndex = this.charTimeline.length;
                for (var i = 0; i < this.charTimeline.length; i++) {
                    if (this.charTimeline[i] > time) { charIndex = i; break; }
                }
                return charIndex;
            },

            _updateDisplayByTime: function() {
                if (this._isLeaving || state.isPlayingAnnotation) return;
                if (this.currentTime > 0.5) this._hasPlayed = true;
                if (!this._hasPlayed && this.currentTime < 0.5) return;

                if (this._currentSegment && this._currentSegment.type === 'text_segment') {
                    var segTimeline = this._currentSegment.char_timeline;
                    if (typeof segTimeline === 'string') { try { segTimeline = JSON.parse(segTimeline); } catch(e) { segTimeline = []; } }
                    if (segTimeline && segTimeline.length > 0) {
                        var charIndex = 0;
                        for (var i = 0; i < segTimeline.length; i++) {
                            if (segTimeline[i] > this.currentTime) { charIndex = i; break; }
                            charIndex = i + 1;
                        }
                        charIndex = Math.min(segTimeline.length, charIndex + this.TEXT_AHEAD_OFFSET);
                        var globalCharIndex = this._currentSegment.start_char + charIndex;
                        reader.revealCharsUpTo(globalCharIndex);
                        reader._currentPosition = globalCharIndex;
                        reader._checkAnnotationTrigger(globalCharIndex);
                        if (globalCharIndex % 100 < 5) reader.saveProgress(globalCharIndex);
                        var now = Date.now();
                        if (!this._lastLogTime || now - this._lastLogTime > 5000) {
                            this._lastLogTime = now;
                            console.log('[同步] seg=' + this._currentSegment.id + ' time=' + this.currentTime.toFixed(1) + 's charIdx=' + charIndex + '/' + segTimeline.length + ' globalChar=' + globalCharIndex);
                        }
                    }
                }

                if (this.audioDuration > 0) {
                    var progress = (this.currentTime / this.audioDuration) * 100;
                    document.getElementById('progressFill').style.width = progress + '%';

                }

            },

            _checkTTSStatus: function() {

                var self = this;
                if (!state.currentBook) return;
                fetch(API_BASE + '/books/' + state.currentBook.id + '/tts-status')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        var status = data.tts_status || 'none';
                        var progress = data.tts_progress || '';
                        if (status === 'done') {
                            self._hideTTSStatus();
                            var section = state.currentSections[state.currentSectionIndex];
                            if (section) self.loadSection(section.id);
                        } else if (status === 'generating') {
                            self._showTTSStatus('正在生成语音 ' + progress + '...');
                            setTimeout(function() { self._checkTTSStatus(); }, 5000);
                        } else if (status === 'error') {
                            self._showTTSStatus('语音生成失败');
                        } else {
                            self._showTTSStatus('语音尚未生成，请等待...');
                            setTimeout(function() { self._checkTTSStatus(); }, 5000);
                        }
                    }).catch(function() {});
            },

            _showTTSStatus: function(msg) {
                var el = document.getElementById('ttsStatusBar');
                if (!el) {
                    el = document.createElement('div'); el.id = 'ttsStatusBar'; el.className = 'tts-status-bar';
                    var container = document.querySelector('.chalkboard');
                    if (container) container.insertBefore(el, container.firstChild);
                }
                el.textContent = msg; el.style.display = 'block';
            },

            _hideTTSStatus: function() {
                var el = document.getElementById('ttsStatusBar');
                if (el) el.style.display = 'none';
            }
        };

        var thoughtEditor = {
            isEditMode: false,
            _startChar: -1,
            _endChar: -1,
            _wasPlayingBeforeEdit: false,
            _saveCompleted: false,

            toggleEditMode: function() {
                if (this.isEditMode) this.exitEditMode(); else this.enterEditMode();
            },

            enterEditMode: function() {
                this.isEditMode = true;
                this._wasPlayingBeforeEdit = state.isPlaying || player.isPlaying;
                if (this._wasPlayingBeforeEdit) player.pause();
                var btn = document.getElementById('editAnnotationBtn');
                if (btn) btn.textContent = '✓ 完成思考';
                var self = this;
                document.querySelectorAll('.chalk-char.visible').forEach(function(c) {
                    c.classList.add('selectable');
                    c.addEventListener('click', self._onCharClick);
                });
            },

            exitEditMode: function() {
                this.isEditMode = false; this._startChar = -1; this._endChar = -1; this._wasPlayingBeforeEdit = false;
                var btn = document.getElementById('editAnnotationBtn');
                if (btn) btn.textContent = '+思考';
                document.querySelectorAll('.chalk-char.selectable').forEach(function(c) {
                    c.classList.remove('selectable', 'thought-selected');
                    c.removeEventListener('click', thoughtEditor._onCharClick);
                });
            },

            _onCharClick: function(e) {
                var charSpan = e.currentTarget;
                var charIndex = parseInt(charSpan.dataset.index);
                if (thoughtEditor._startChar === -1) {
                    thoughtEditor._startChar = charIndex;
                    thoughtEditor._highlightSelection(charIndex, charIndex);
                } else {
                    thoughtEditor._endChar = charIndex;
                    var start = Math.min(thoughtEditor._startChar, thoughtEditor._endChar);
                    var end = Math.max(thoughtEditor._startChar, thoughtEditor._endChar);
                    thoughtEditor._highlightSelection(start, end);
                    thoughtEditor._showModal(start, end);
                }
            },

            _highlightSelection: function(start, end) {
                document.querySelectorAll('.chalk-char.thought-selected').forEach(function(c) { c.classList.remove('thought-selected'); });
                reader._allChars.forEach(function(c, i) { if (i >= start && i <= end) c.classList.add('thought-selected'); });
            },

            _showModal: function(start, end) {
                var originalText = '';
                for (var i = start; i <= end && i < reader._allChars.length; i++) originalText += reader._allChars[i].textContent;
                document.getElementById('thoughtOriginalText').textContent = originalText;
                document.getElementById('thoughtContent').value = '';
                document.getElementById('thoughtStartChar').value = start;
                document.getElementById('thoughtEndChar').value = end;
                document.getElementById('thoughtModalOverlay').style.display = 'flex';
            },

            saveThought: function() {
                var section = state.currentSections[state.currentSectionIndex];
                if (!section || !state.currentUser) { alert('请先登录'); return; }
                var content = document.getElementById('thoughtContent').value.trim();
                if (!content) { alert('请输入思考内容'); return; }
                var startChar = parseInt(document.getElementById('thoughtStartChar').value);
                var endChar = parseInt(document.getElementById('thoughtEndChar').value);
                var originalText = document.getElementById('thoughtOriginalText').textContent;
                var self = this;
                this._saveCompleted = false;
                var saveBtn = document.getElementById('thoughtSaveBtn');
                var cancelBtn = saveBtn.previousElementSibling;
                var originalSaveText = saveBtn.textContent;
                saveBtn.disabled = true; cancelBtn.disabled = true;
                var countdown = 30;
                var countdownInterval = setInterval(function() { saveBtn.textContent = 'AI评分中 ' + countdown + '秒'; countdown--; if (countdown < 0) countdown = 0; }, 1000);
                var timeoutId = setTimeout(function() {
                    if (self._saveCompleted) return; self._saveCompleted = true;
                    clearInterval(countdownInterval); saveBtn.textContent = originalSaveText; saveBtn.disabled = false; cancelBtn.disabled = false;
                    self._showResultModal(null, null);
                    var shouldResume = self._wasPlayingBeforeEdit;
                    thoughtEditor.exitEditMode(); thoughtEditor._closeModal(); thoughtEditor.loadThoughts();
                    if (shouldResume) player.play();
                }, 30000);

                fetch(API_BASE + '/sections/' + section.id + '/thoughts', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: state.currentUser.id, start_char: startChar, end_char: endChar, original_text: originalText, content: content })
                }).then(function(r) { return r.json(); }).then(function(data) {
                    if (self._saveCompleted) return; self._saveCompleted = true;
                    clearTimeout(timeoutId); clearInterval(countdownInterval);
                    saveBtn.textContent = originalSaveText; saveBtn.disabled = false; cancelBtn.disabled = false;
                    if (data.thought_id) {
                        self._showResultModal(data.ai_score, data.score_reason);
                        var shouldResume = self._wasPlayingBeforeEdit;
                        thoughtEditor.exitEditMode(); thoughtEditor._closeModal(); thoughtEditor.loadThoughts();
                        if (shouldResume) player.play();
                    } else { alert(data.error || '保存失败'); }
                }).catch(function(e) {
                    if (self._saveCompleted) return; self._saveCompleted = true;
                    clearTimeout(timeoutId); clearInterval(countdownInterval);
                    saveBtn.textContent = originalSaveText; saveBtn.disabled = false; cancelBtn.disabled = false;
                    alert('保存失败: ' + e);
                });
            },

            _showResultModal: function(aiScore, scoreReason) {
                var scoreEl = document.getElementById('resultScore');
                var reasonEl = document.getElementById('resultReason');
                if (aiScore !== null && aiScore !== undefined) {
                    var stars = '';
                    for (var i = 0; i < 3; i++) stars += (i < aiScore) ? '⭐' : '☆';
                    scoreEl.innerHTML = stars + ' <span style="font-size:14px;color:#666;">（' + aiScore + '星）</span>';
                    reasonEl.textContent = scoreReason || '';
                } else {
                    scoreEl.innerHTML = '<span style="color:#999;">无</span>';
                    reasonEl.textContent = '未获得AI结果，请过后查看';
                }
                document.getElementById('thoughtResultModal').style.display = 'flex';
            },

            _closeModal: function() {
                document.getElementById('thoughtModalOverlay').style.display = 'none';
                this._startChar = -1; this._endChar = -1;
                document.querySelectorAll('.chalk-char.thought-selected').forEach(function(c) { c.classList.remove('thought-selected'); });
            },

            loadThoughts: function() {
                var section = state.currentSections[state.currentSectionIndex];
                if (!section || !state.currentUser) return;
                fetch(API_BASE + '/sections/' + section.id + '/thoughts?user_id=' + state.currentUser.id)
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        thoughtEditor._clearLanterns();
                        (data.thoughts || []).sort(function(a, b) { return (a.thought_index || a.id) - (b.thought_index || b.id); })
                            .forEach(function(t, index) { t.displayIndex = index + 1; thoughtEditor._addLantern(t); });
                    });
            },

            _clearLanterns: function() {
                var container = document.getElementById('thoughtLanternsContainer');
                if (container) container.innerHTML = '';
            },

            _getLanternContainer: function() {
                var btn = document.getElementById('editAnnotationBtn');
                if (!btn) return null;
                var container = document.getElementById('thoughtLanternsContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'thoughtLanternsContainer';
                    container.className = 'thought-lanterns-container';
                    document.body.appendChild(container);
                }
                this._updateLanternContainerPosition();
                return container;
            },

            _updateLanternContainerPosition: function() {
                var btn = document.getElementById('editAnnotationBtn');
                var container = document.getElementById('thoughtLanternsContainer');
                if (!btn || !container) return;
                var rect = btn.getBoundingClientRect();
                container.style.left = (rect.left + rect.width / 2) + 'px';
                container.style.top = (rect.bottom + 10) + 'px';
            },

            _addLantern: function(thought) {
                var container = this._getLanternContainer();
                if (!container) return;
                var lantern = document.createElement('span');
                lantern.className = 'thought-lantern';
                lantern.textContent = thought.displayIndex;
                lantern.dataset.thoughtId = thought.id;
                var score = thought.ai_score;
                if (score === 1) lantern.classList.add('lantern-orange');
                else if (score === 2) lantern.classList.add('lantern-pink');
                else if (score === 3) lantern.classList.add('lantern-red');
                var tassel = document.createElement('span');
                tassel.className = 'tassel';
                lantern.appendChild(tassel);
                this._updateLanternState(lantern);
                lantern.onclick = function(e) {
                    e.stopPropagation();
                    if (state.isPlaying || player.isPlaying) return;
                    thoughtEditor._showDetail(thought);
                };
                container.appendChild(lantern);
            },

            _updateLanternState: function(lantern) {
                if (state.isPlaying || player.isPlaying) lantern.classList.add('playing');
                else lantern.classList.remove('playing');
            },

            updateAllLanternsState: function() {
                var container = document.getElementById('thoughtLanternsContainer');
                if (!container) return;
                if (state.isPlaying || player.isPlaying) container.classList.add('playing');
                else container.classList.remove('playing');
            },

            _highlightQuote: function(start, end) {
                this._clearQuoteHighlight();
                for (var i = start; i <= end && i < reader._allChars.length; i++) reader._allChars[i].classList.add('thought-quote-highlight');
            },

            _clearQuoteHighlight: function() {
                document.querySelectorAll('.chalk-char.thought-quote-highlight').forEach(function(c) { c.classList.remove('thought-quote-highlight'); });
            },

            _showDetail: function(thought) {
                this._highlightQuote(thought.start_char, thought.end_char);
                document.getElementById('thoughtDetailQuote').textContent = thought.original_text || '';
                document.getElementById('thoughtDetailContent').textContent = thought.content || '';
                var aiScore = thought.ai_score;
                var scoreEl = document.getElementById('thoughtDetailScore');
                var reasonSection = document.getElementById('thoughtDetailReasonSection');
                var reasonEl = document.getElementById('thoughtDetailReason');
                if (aiScore !== null && aiScore !== undefined) {
                    var stars = '';
                    for (var i = 0; i < 3; i++) stars += (i < aiScore) ? '⭐' : '☆';
                    scoreEl.textContent = stars + '（' + aiScore + '星）';
                    scoreEl.style.display = 'inline';
                } else { scoreEl.textContent = '无'; scoreEl.style.display = 'inline'; }
                if (thought.score_reason) { reasonEl.textContent = thought.score_reason; reasonSection.style.display = 'block'; }
                else { reasonSection.style.display = 'none'; }
                document.getElementById('thoughtDetailModal').style.display = 'flex';
            },

            closeDetailModal: function() {
                document.getElementById('thoughtDetailModal').style.display = 'none';
                this._clearQuoteHighlight();
            }
        };

        window.addEventListener('beforeunload', function() {
            player._isLeaving = true;
            var section = state.currentSections[state.currentSectionIndex];
            if (!section || !state.currentBook || !state.currentBook.id) return;
            var sectionStatus = (state.catalogStatusMap && state.catalogStatusMap[section.id]) || '';
            if (sectionStatus === 'read') return;
            var pos = reader._currentPosition || 0;
            if (pos <= 0) return;
            if (typeof player !== 'undefined' && player._currentSegment && player._currentSegment.type === 'text_segment') {
                var progressData = {
                    book_id: state.currentBook.id, section_id: section.id,
                    segment_id: player._currentSegment.id,
                    text_position: pos - player._currentSegment.start_char,
                    audio_position: player.currentTime || 0,
                    current_section_id: section.id
                };
                if (state.currentUser && state.currentUser.id) progressData.user_id = state.currentUser.id;
                navigator.sendBeacon(API_BASE + '/progress/v2', JSON.stringify(progressData));
            }
        });

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                player._isLeaving = true;
                reader.saveProgress(reader._currentPosition || 0);
                if (player.isPlaying) player.pause();
            } else { player._isLeaving = false; }
        });

        initReader();
    </script>
</body>
</html>
