<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>军衔肩章测试</title>
    <style>
        body { background: #1a1a2e; color: white; padding: 20px; font-family: sans-serif; }
        .rank-item { display: inline-block; margin: 10px; padding: 15px; background: #16213e; border-radius: 8px; text-align: center; width: 160px; }
        .epaulette { margin: 10px auto; min-height: 40px; }
        .rank-name { color: #FFD700; font-weight: bold; font-size: 14px; }
        .rank-title { color: #888; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>
    <h2 style="color:#FFD700;">🎖️ 所有军衔肩章预览</h2>
    <div id="ranks"></div>

<script>
// 所有军衔数据
var ranks = [
    {icon:'private', name:'列兵', title:'阅读新兵'},
    {icon:'private_first', name:'上等兵', title:'阅读学徒'},
    {icon:'sergeant_1', name:'下士', title:'阅读战士'},
    {icon:'sergeant_2', name:'中士', title:'阅读骨干'},
    {icon:'sergeant_3', name:'上士', title:'阅读精兵'},
    {icon:'sergeant_4', name:'四级军士长', title:'阅读能手'},
    {icon:'sergeant_5', name:'三级军士长', title:'阅读达人'},
    {icon:'sergeant_6', name:'二级军士长', title:'阅读专家'},
    {icon:'sergeant_7', name:'一级军士长', title:'阅读大师'},
    {icon:'2lt', name:'少尉', title:'阅读军官'},
    {icon:'1lt', name:'中尉', title:'阅读校官'},
    {icon:'cpt', name:'上尉', title:'阅读将官'},
    {icon:'maj', name:'少校', title:'阅读统帅'},
    {icon:'ltc', name:'中校', title:'阅读传奇'},
    {icon:'col', name:'上校', title:'阅读神话'},
    {icon:'sen_col', name:'大校', title:'阅读至尊'},
    {icon:'bg', name:'少将', title:'阅读战神'},
    {icon:'mg', name:'中将', title:'阅读王者'},
    {icon:'lg', name:'上将', title:'阅读帝皇'},
    {icon:'marshal', name:'元帅', title:'阅读之神'},
];

function renderEpaulette(icon) {
    var bg = '#2d5016';
    var border = '#1a3a0a';
    var w = 120, h = 36;
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:120px;">';
    svg += '<rect x="1" y="1" width="' + (w-2) + '" height="' + (h-2) + '" rx="4" fill="' + bg + '" stroke="' + border + '" stroke-width="1.5"/>';
    svg += '<rect x="4" y="4" width="' + (w-8) + '" height="' + (h-8) + '" rx="2" fill="none" stroke="#c8a84e" stroke-width="0.8" opacity="0.5"/>';

    var cx = w / 2, cy = h / 2;

    if (icon === 'private') {
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="3" fill="#c8a84e" opacity="0.6"/>';
    } else if (icon === 'private_first') {
        svg += drawBar(cx, cy, 1);
    } else if (icon === 'sergeant_1') {
        svg += drawStripe(cx, cy, 1, '#c8a84e');
    } else if (icon === 'sergeant_2') {
        svg += drawStripe(cx, cy, 2, '#c8a84e');
    } else if (icon === 'sergeant_3') {
        svg += drawStripe(cx, cy, 3, '#c8a84e');
    } else if (icon === 'sergeant_4') {
        svg += drawStripe(cx, cy, 1, '#c8a84e', 4);
    } else if (icon === 'sergeant_5') {
        svg += drawStripe(cx, cy - 3, 1, '#c8a84e', 4);
        svg += drawStripe(cx, cy + 3, 1, '#c8a84e', 2);
    } else if (icon === 'sergeant_6') {
        svg += drawStripe(cx, cy - 4, 1, '#c8a84e', 4);
        svg += drawStripe(cx, cy + 2, 2, '#c8a84e', 2);
    } else if (icon === 'sergeant_7') {
        svg += drawStripe(cx, cy - 5, 1, '#c8a84e', 4);
        svg += drawStripe(cx, cy + 1, 1, '#c8a84e', 4);
        svg += drawStripe(cx, cy + 7, 1, '#c8a84e', 2);
    } else if (icon === '2lt') {
        svg += drawStar(cx, cy, 6, '#c8a84e');
    } else if (icon === '1lt') {
        svg += drawStar(cx - 10, cy, 5, '#c8a84e');
        svg += drawStar(cx + 10, cy, 5, '#c8a84e');
    } else if (icon === 'cpt') {
        svg += drawStar(cx - 16, cy, 4.5, '#c8a84e');
        svg += drawStar(cx, cy, 4.5, '#c8a84e');
        svg += drawStar(cx + 16, cy, 4.5, '#c8a84e');
    } else if (icon === 'maj') {
        svg += drawStar(cx, cy, 8, '#c8a84e');
    } else if (icon === 'ltc') {
        svg += drawStar(cx - 12, cy, 7, '#c8a84e');
        svg += drawStar(cx + 12, cy, 7, '#c8a84e');
    } else if (icon === 'col') {
        svg += drawStar(cx - 18, cy, 6, '#c8a84e');
        svg += drawStar(cx, cy, 6, '#c8a84e');
        svg += drawStar(cx + 18, cy, 6, '#c8a84e');
    } else if (icon === 'sen_col') {
        svg += drawStar(cx - 22, cy, 5, '#c8a84e');
        svg += drawStar(cx - 7, cy, 5, '#c8a84e');
        svg += drawStar(cx + 7, cy, 5, '#c8a84e');
        svg += drawStar(cx + 22, cy, 5, '#c8a84e');
    } else if (icon === 'bg') {
        svg += drawStar(cx, cy, 10, '#FFD700', '#DAA520');
    } else if (icon === 'mg') {
        svg += drawStar(cx - 14, cy, 8, '#FFD700', '#DAA520');
        svg += drawStar(cx + 14, cy, 8, '#FFD700', '#DAA520');
    } else if (icon === 'lg') {
        svg += drawStar(cx - 20, cy, 7, '#FFD700', '#DAA520');
        svg += drawStar(cx, cy, 7, '#FFD700', '#DAA520');
        svg += drawStar(cx + 20, cy, 7, '#FFD700', '#DAA520');
    } else if (icon === 'marshal') {
        svg += drawStar(cx, cy, 12, '#FFD700', '#DAA520');
        svg += '<text x="' + cx + '" y="' + (cy + 3) + '" text-anchor="middle" font-size="6" fill="#FFD700" font-weight="bold">帅</text>';
    }

    svg += '</svg>';
    return svg;
}

function drawBar(cx, cy, count) {
    var s = '';
    var bw = 40;
    for (var i = 0; i < count; i++) {
        var y = cy - 2 + i * 5;
        s += '<rect x="' + (cx - bw/2) + '" y="' + y + '" width="' + bw + '" height="3" rx="1" fill="#8B7355"/>';
    }
    return s;
}

function drawStripe(cx, cy, count, color, thickness) {
    thickness = thickness || 2.5;
    var s = '';
    var bw = 50;
    var gap = thickness + 2;
    var startY = cy - ((count - 1) * gap) / 2;
    for (var i = 0; i < count; i++) {
        var y = startY + i * gap - thickness / 2;
        s += '<rect x="' + (cx - bw/2) + '" y="' + y + '" width="' + bw + '" height="' + thickness + '" rx="1" fill="' + color + '"/>';
    }
    return s;
}

function drawStar(cx, cy, r, fill, stroke) {
    r = r || 6;
    fill = fill || '#c8a84e';
    var points = '';
    for (var i = 0; i < 5; i++) {
        var angle = -Math.PI / 2 + (i * 2 * Math.PI / 5);
        var x = cx + r * Math.cos(angle);
        var y = cy + r * Math.sin(angle);
        points += x.toFixed(1) + ',' + y.toFixed(1) + ' ';
        angle += Math.PI / 5;
        x = cx + (r * 0.4) * Math.cos(angle);
        y = cy + (r * 0.4) * Math.sin(angle);
        points += x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    }
    var s = '<polygon points="' + points.trim() + '" fill="' + fill + '"';
    if (stroke) s += ' stroke="' + stroke + '" stroke-width="0.5"';
    s += '/>';
    return s;
}

// 渲染所有军衔
var html = '';
ranks.forEach(function(r) {
    html += '<div class="rank-item">';
    html += '<div class="epaulette">' + renderEpaulette(r.icon) + '</div>';
    html += '<div class="rank-name">' + r.name + '</div>';
    html += '<div class="rank-title">' + r.title + '</div>';
    html += '</div>';
});
document.getElementById('ranks').innerHTML = html;
</script>
</body>
</html>
