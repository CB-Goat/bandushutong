services:
  backend:
    build: .
    container_name: reading-companion-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # 只挂载数据库文件（不覆盖整个backend目录）
      - /www/dk_project/wwwroot/lit.handy.xin/data/reading_companion.db:/app/backend/reading_companion.db
      # 音频文件挂载
      - /www/dk_project/wwwroot/lit.handy.xin/audio_files:/app/audio_files
    environment:
      - FLASK_ENV=production
      - TZ=Asia/Shanghai
      # MySQL 数据库配置
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=reading_user
      - DB_PASSWORD=reading_pass
      - DB_NAME=reading_companion
    dns:
      - 223.5.5.5
      - 8.8.8.8
