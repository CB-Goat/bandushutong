version: '3.8'

services:
  backend:
    build: .
    container_name: reading-companion-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据库
      - ./data:/app/instance
    environment:
      - FLASK_ENV=production
      - TZ=Asia/Shanghai

  nginx:
    image: nginx:alpine
    container_name: reading-companion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL证书目录（可选）
    depends_on:
      - backend
